        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #f5f0ff;
            --bg-primary-rgb: 245, 240, 255;
            --bg-secondary: #e9dcff;
            --bg-card: #ffffff;
            --text-primary: #2d1b4e;
            --text-secondary: #6b4fa3;
            --accent: #9b7fd4;
            --border: #d4c5f0;
            --hover: #f0e7ff;
        }

        [data-theme="dark"] {
            --bg-primary: #1a0d2e;
            --bg-primary-rgb: 26, 13, 46;
            --bg-secondary: #2d1b4e;
            --bg-card: #3d2a5c;
            --text-primary: #f5f0ff;
            --text-secondary: #c5b3e6;
            --accent: #9b7fd4;
            --border: #5a4178;
            --hover: #4a3366;
        }

        body {
            font-family: 'Wizzta', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: background 0.3s, color 0.3s;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Scrollbar styling for light mode */
        ::-webkit-scrollbar {
            width: 14px;
            height: 14px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 6px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }

        /* Firefox scrollbar */
        * {
            scrollbar-width: thin;
            scrollbar-color: var(--border) var(--bg-secondary);
        }

        .header {
            background: var(--bg-secondary);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 2rem;
            border-bottom: 2px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header h1 {
            font-size: 1.5rem;
            color: var(--accent);
            letter-spacing: 2px;
            margin: 0;
            white-space: nowrap;
        }

        .header-logo {
            height: 50px;
            width: auto;
            border-radius: 8px;
            padding: 5px 10px;
            background: #000;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .moxfield-import-section {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            flex: 1;
            max-width: 700px;
        }

        .moxfield-input-main {
            flex: 1;
            padding: 0.85rem 1.2rem;
            background: var(--bg-primary);
            border: 2px solid var(--border);
            border-radius: 50px;
            color: var(--text-primary);
            font-size: 1rem;
        }

        .import-btn-main {
            padding: 0.85rem 1.5rem;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            white-space: nowrap;
            font-size: 1rem;
        }

        .import-btn-main:hover {
            background: #c5b3e6;
            transform: translateY(-2px);
        }

        .manual-btn {
            padding: 0.85rem 1.2rem;
            background: var(--bg-card);
            color: var(--text-primary);
            border: 2px solid var(--border);
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            white-space: nowrap;
            font-size: 1rem;
        }

        .manual-btn:hover {
            border-color: var(--accent);
            background: var(--hover);
        }

        .header-controls {
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }

        .theme-toggle {
            background: var(--bg-card);
            border: 2px solid var(--border);
            color: var(--text-primary);
            padding: 0.7rem 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.2s;
        }

        .theme-toggle:hover {
            background: var(--hover);
            transform: scale(1.05);
        }

        .deck-selector {
            background: var(--bg-card);
            border: 2px solid var(--border);
            color: var(--text-primary);
            padding: 0.7rem 1.8rem 0.7rem 1.2rem;
            border-radius: 50px;
            font-size: 1rem;
            cursor: pointer;
            width: auto;
            min-width: auto;
        }

        .container {
            display: flex;
            flex: 1;
            min-height: 0;
        }

        .container {
            display: flex;
            flex: 1;
            min-height: 0;
        }

        .panel {
            flex: 1;
            padding: 0 1.5rem 1.5rem 1.5rem;
            overflow-y: auto;
            position: relative;
        }

        .right-panel {
            display: flex;
            flex-direction: column;
            padding: 0 !important;
            overflow-y: hidden !important;
            overflow-x: hidden !important;
        }

        .deck-content-scroll {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 5rem 1.5rem 0 1.5rem;
            min-height: 0;
        }

        .left-panel {
            border-right: 2px solid var(--border);
            max-width: 450px;
            padding: 1.5rem 1.5rem 1.5rem 1.5rem !important;
        }

        .search-section {
            margin-bottom: 1.5rem;
            padding: 0;
            min-width: 100%;
        }
        
        #cardSearch {
            width: 100% !important;
            box-sizing: border-box !important;
            min-width: 100% !important;
        }
        
        .search-results {
            padding: 0;
            width: 100%;
        }

        .search-input {
            width: 100%;
            padding: 0.9rem 1.2rem;
            border: 2px solid var(--border);
            border-radius: 50px;
            background: var(--bg-card);
            color: var(--text-primary);
            font-size: 1.05rem;
            margin-bottom: 1rem;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.9rem 1.8rem;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: 2px solid var(--border);
        }

        .search-results {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .card-item {
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 8px;
            padding: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;

                            <option value="Enchantment">Enchantments</option>
                            <option value="Artifact">Artifacts</option>
                            <option value="Planeswalker">Planeswalkers</option>

                        <span class="sort-label">Sort by:</span>
                        <select class="sort-select" id="sortBy">
                            <option value="name">Name</option>
                            <option value="color">Color (WUBRG)</option>
                            <option value="cmc">Mana Cost</option>
                        </select>
                    </div>
                    <div class="sort-group">
                        <span class="sort-label">Order:</span>
                        <select class="sort-select" id="sortOrder">
                            <option value="asc">Ascending</option>
                            <option value="desc">Descending</option>
                        </select>
                    </div>
                </div>
                <div class="deck-list" id="deckList">
                    <div class="empty-state">Start building your deck!</div>
                </div>
            </div>

            <div class="deck-section" id="tokenSection" style="display: none;">
                <div class="deck-header">
                    <h2 class="deck-title">Other Cards</h2>
                    <div class="card-count" id="tokenCount">0</div>
                </div>
                <div class="deck-list" id="tokenList"></div>

            </div><!-- end deck-content-scroll -->
        </div>

    <div class="modal" id="altArtModal">
        <div class="modal-content">
            <button class="modal-close" id="closeModal">✕ Close</button>
            <h2 class="modal-title">Choose Alternate Art</h2>
            <div class="custom-url-section">
                <h3>Or use custom image URL (Imgur, etc.)</h3>
                <input 
                    type="text" 
                    class="custom-url-input" 
                    id="customUrlInput" 
                    placeholder="Paste image URL..."
                />
                <button class="btn url-btn" id="useCustomUrl">Use Custom URL</button>
            </div>
            <div class="alt-art-grid" id="altArtGrid"></div>
        </div>
    </div>

    <!-- Card Back Modal -->
    <!-- Export Modal (includes card back and filename) -->
    <div class="modal" id="exportModal">
        <div class="card-back-modal-content">
            <button class="modal-close" id="closeExportModal">✕ Close</button>
            <h2 class="modal-title">Export to Tabletop Simulator</h2>
            
            <div class="card-back-input-group">
                <label for="filenameInput">Deck Filename</label>
                <input 
                    type="text" 
                    class="card-back-url-input" 
                    id="filenameInput" 
                    placeholder="deck-name.json"
                />
            </div>
            
            <div class="card-back-input-group">
                <label for="cardBackUrlInput">Card Back Image URL</label>
                <img class="card-back-preview-large" id="cardBackPreviewLarge" src="https://i.imgur.com/Hg8CwwU.jpeg" alt="Card back preview">
                <input 
                    type="text" 
                    class="card-back-url-input" 
                    id="cardBackUrlInput" 
                    placeholder="https://i.imgur.com/example.jpg"
                />
            </div>
            
            <div class="card-back-actions">
                <button class="card-back-btn card-back-btn-reset" id="resetCardBackBtn">Reset to Default</button>
                <button class="card-back-btn card-back-btn-save" id="exportBtn">Export to TTS</button>
            </div>
        </div>
    </div>

    <div class="card-preview" id="cardPreview">
        <img src="" alt="Card preview" id="previewImg">
    </div>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-content">
            <div class="loading-spinner"></div>
            <div class="loading-title">Importing Deck</div>
            <div class="loading-message">Sourcing the lands for your spells...</div>
            <div class="loading-progress">
                <div class="loading-progress-bar" id="loadingProgressBar"></div>
            </div>
            <div class="loading-progress-text" id="loadingProgressText">0%</div>
        </div>
    </div>

    <div class="notification-container" id="notificationContainer"></div>

    <script>
        // State management
        let decks = [];
        let currentDeckIndex = 0;
        let searchTimeout = null;
        let currentFilter = 'all';
        let currentAltArtCard = null;

        // Initialize
        function init() {
            loadSavedTheme();
            loadDecks();
            setupEventListeners();
            renderDeck();
            updateCardBackPreview();
        }

        // Local storage management
        function loadDecks() {
            const saved = localStorage.getItem('commander2tts_decks');
            if (saved) {
                decks = JSON.parse(saved);
                // Ensure all decks have cardBackUrl property
                decks.forEach(deck => {
                    if (!deck.cardBackUrl) {
                        deck.cardBackUrl = 'https://i.imgur.com/Hg8CwwU.jpeg';
                    }
                });
            }
            if (decks.length === 0) {
                decks.push(createNewDeck());
            }
            updateDeckSelector();
        }

        function saveDecks() {
            localStorage.setItem('commander2tts_decks', JSON.stringify(decks));
        }

        function createNewDeck() {
            return {
                name: `Deck ${decks.length + 1}`,
                commander: null,
                cards: [],
                tokens: [],
                cardBackUrl: 'https://i.imgur.com/Hg8CwwU.jpeg'
            };
        }

        function getCurrentDeck() {
            return decks[currentDeckIndex];
        }

        function updateDeckSelector() {
            const selector = document.getElementById('deckSelector');
            selector.innerHTML = '';
            decks.forEach((deck, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = deck.name || `Deck ${index + 1}`;
                if (index === currentDeckIndex) option.selected = true;
                selector.appendChild(option);
            });
        }

        // Event listeners
        function setupEventListeners() {
            // Theme toggle
            document.getElementById('themeToggle').addEventListener('click', toggleTheme);

            // Deck management
            document.getElementById('deckSelector').addEventListener('change', (e) => {
                currentDeckIndex = parseInt(e.target.value);
                renderDeck();
                updateCardBackPreview();
            });

            document.getElementById('newDeckBtn').addEventListener('click', () => {
                decks.push(createNewDeck());
                currentDeckIndex = decks.length - 1;
                saveDecks();
                updateDeckSelector();
                renderDeck();
            });

            // Search
            document.getElementById('cardSearch').addEventListener('input', (e) => {
                clearTimeout(searchTimeout);
                const query = e.target.value.trim();
                if (query.length < 2) {
                    document.getElementById('searchResults').innerHTML = '';
                    return;
                }
                searchTimeout = setTimeout(() => searchCards(query), 300);
            });

            // Deck search
            document.getElementById('deckSearch').addEventListener('input', (e) => {
                const query = e.target.value.trim().toLowerCase();
                highlightCards(query);
            });

            // Moxfield import
            document.getElementById('importBtn').addEventListener('click', importFromMoxfield);

            // Manual button toggle
            document.getElementById('manualBtn').addEventListener('click', () => {
                const leftPanel = document.getElementById('leftPanel');
                if (leftPanel.style.display === 'none') {
                    leftPanel.style.display = 'flex';
                } else {
                    leftPanel.style.display = 'none';
                }
            });

            // Category and sort controls
            document.getElementById('categorySelect').addEventListener('change', () => {
                currentFilter = document.getElementById('categorySelect').value;
                renderDeck();
            });

            document.getElementById('sortBy').addEventListener('change', renderDeck);
            document.getElementById('sortOrder').addEventListener('change', renderDeck);

            // Export
            // Deck menu
            document.getElementById('deckMenuBtn').addEventListener('click', (e) => {
                e.stopPropagation();
                const menu = document.getElementById('deckMenu');
                menu.classList.toggle('show');
            });

            // Close menu when clicking outside
            document.addEventListener('click', (e) => {
                const menu = document.getElementById('deckMenu');
                const menuBtn = document.getElementById('deckMenuBtn');
                if (!menuBtn.contains(e.target)) {
                    menu.classList.remove('show');
                }
            });

            document.getElementById('exportDeckBtn').addEventListener('click', openExportModal);
            document.getElementById('deleteDeckBtn').addEventListener('click', deleteCurrentDeck);

            // Export Modal
            document.getElementById('closeExportModal').addEventListener('click', closeExportModal);
            document.getElementById('exportBtn').addEventListener('click', exportToTTS);
            document.getElementById('resetCardBackBtn').addEventListener('click', resetCardBackToDefault);
            
            // Update preview as user types
            document.getElementById('cardBackUrlInput').addEventListener('input', (e) => {
                const url = e.target.value.trim();
                if (url) {
                    document.getElementById('cardBackPreviewLarge').src = url;
                }
            });

            // Modal
            document.getElementById('closeModal').addEventListener('click', closeAltArtModal);
            document.getElementById('useCustomUrl').addEventListener('click', useCustomUrl);
        }

        function toggleTheme() {
            const body = document.body;
            const currentTheme = body.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            body.setAttribute('data-theme', newTheme);
            document.getElementById('themeToggle').textContent = newTheme === 'light' ? '🌙' : '☀️';
            localStorage.setItem('theme', newTheme);
        }

        // Load saved theme on page load
        function loadSavedTheme() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme) {
                document.body.setAttribute('data-theme', savedTheme);
                document.getElementById('themeToggle').textContent = savedTheme === 'light' ? '🌙' : '☀️';
            }
        }

        // Scryfall API
        async function searchCards(query) {
            const resultsDiv = document.getElementById('searchResults');
            resultsDiv.innerHTML = '<div class="loading">Searching...</div>';

            try {
                const response = await fetch(`https://api.scryfall.com/cards/search?q=${encodeURIComponent(query)}&unique=cards`);
                const data = await response.json();

                if (data.data && data.data.length > 0) {
                    resultsDiv.innerHTML = '';
                    data.data.slice(0, 20).forEach(card => {
                        const cardElement = createSearchResultCard(card);
                        resultsDiv.appendChild(cardElement);
                    });
                } else {
                    resultsDiv.innerHTML = '<div class="empty-state">No cards found</div>';
                }
            } catch (error) {
                resultsDiv.innerHTML = '<div class="empty-state">Error searching cards</div>';
                console.error('Search error:', error);
            }
        }

        function createSearchResultCard(card) {
            const div = document.createElement('div');
            div.className = 'card-item';
            
            const imageUrl = card.image_uris?.normal || (card.card_faces?.[0]?.image_uris?.normal);
            
            div.innerHTML = `
                <div>
                    <span class="card-name">${card.name}</span>
                    <span class="card-type">${card.type_line}</span>
                </div>
            `;

            div.addEventListener('click', () => addCardToDeck(card));
            
            // Hover preview
            div.addEventListener('mouseenter', (e) => showCardPreview(imageUrl, e));
            div.addEventListener('mousemove', (e) => moveCardPreview(e));
            div.addEventListener('mouseleave', hideCardPreview);

            return div;
        }

        function addCardToDeck(card) {
            const deck = getCurrentDeck();
            const imageUrl = card.image_uris?.normal || (card.card_faces?.[0]?.image_uris?.normal);
            
            const cardData = {
                id: card.id,
                name: card.name,
                type_line: card.type_line,
                image_url: imageUrl,
                scryfall_uri: card.scryfall_uri,
                cmc: card.cmc || 0,
                colors: card.colors || []
            };

            // Check if it's a legendary creature for commander
            const isLegendaryCreature = card.type_line.includes('Legendary') && card.type_line.includes('Creature');
            
            if (!deck.commander && isLegendaryCreature) {
                // Automatically set as commander
                deck.commander = cardData;
                updateFilename();
                showNotification(`${card.name} set as Commander`, 'success');
            } else {
                deck.cards.push(cardData);
            }

            saveDecks();
            updateDeckSelector();
            renderDeck();
        }

        // Moxfield import
        async function importFromMoxfield() {
            const url = document.getElementById('moxfieldUrl').value.trim();
            if (!url) return;

            const deckId = extractMoxfieldId(url);
            if (!deckId) {
                showNotification('Please enter a valid Moxfield deck URL', 'error', 'Invalid URL');
                return;
            }

            showLoadingOverlay();

            try {
                // Try direct fetch first (some browsers allow it)
                let data = null;
                const moxfieldUrl = `https://api.moxfield.com/v2/decks/all/${deckId}`;
                
                try {
                    const directResponse = await fetch(moxfieldUrl);
                    if (directResponse.ok) {
                        data = await directResponse.json();
                    }
                } catch (e) {
                    console.log('Direct fetch failed, trying proxies...');
                }
                
                // If direct fetch failed, try proxies
                if (!data) {
                    const proxies = [
                        // These are the most reliable currently working proxies
                        `https://corsproxy.io/?${encodeURIComponent(moxfieldUrl)}`,
                        `https://api.allorigins.win/get?url=${encodeURIComponent(moxfieldUrl)}`,
                    ];
                    
                    for (const proxyUrl of proxies) {
                        try {
                            const response = await fetch(proxyUrl);
                            if (response.ok) {
                                const result = await response.json();
                                // allorigins wraps response in contents property
                                data = result.contents ? JSON.parse(result.contents) : result;
                                if (data) break;
                            }
                        } catch (error) {
                            console.warn(`Proxy failed:`, error);
                        }
                    }
                }
                
                if (!data) {
                    throw new Error('Could not fetch deck data. Please try:\n\n1. Use a browser extension like "CORS Unblock"\n2. Try a different deck\n3. Export your deck list as text and add cards manually');
                }

                // Create a new deck for the import
                const newDeck = createNewDeck();
                newDeck.cards = [];
                newDeck.tokens = [];
                newDeck.commander = null;

                // Set deck name from Moxfield
                if (data.name) {
                    newDeck.name = data.name;
                }

                // Add the new deck to the decks array
                decks.push(newDeck);
                currentDeckIndex = decks.length - 1;
                const deck = newDeck;

                // Calculate total items to process
                const commanderCount = data.commanders ? Object.keys(data.commanders).length : 0;
                const mainboardCount = data.mainboard ? Object.keys(data.mainboard).length : 0;
                const tokenCount = data.tokens ? Object.keys(data.tokens).length : 0;
                const totalItems = commanderCount + mainboardCount + tokenCount;
                let processedItems = 0;

                // Process commander
                if (data.commanders) {
                    for (const [cardName, cardData] of Object.entries(data.commanders)) {
                        if (!cardName || typeof cardName !== 'string') continue;
                        
                        const scryfallCard = await fetchCardByName(cardName);
                        if (scryfallCard) {
                            deck.commander = {
                                id: scryfallCard.id,
                                name: scryfallCard.name,
                                type_line: scryfallCard.type_line,
                                image_url: scryfallCard.image_uris?.normal || scryfallCard.card_faces?.[0]?.image_uris?.normal,
                                scryfall_uri: scryfallCard.scryfall_uri,
                                cmc: scryfallCard.cmc || 0,
                                colors: scryfallCard.colors || []
                            };
                        }
                        processedItems++;
                        updateProgress(processedItems, totalItems, '- Loading commander');
                        break; // Only take first commander
                    }
                }

                // Process main deck
                if (data.mainboard) {
                    for (const [cardName, cardData] of Object.entries(data.mainboard)) {
                        if (!cardName || typeof cardName !== 'string') continue;
                        
                        const scryfallCard = await fetchCardByName(cardName);
                        if (scryfallCard) {
                            const quantity = cardData.quantity || 1;
                            for (let i = 0; i < quantity; i++) {
                                deck.cards.push({
                                    id: scryfallCard.id,
                                    name: scryfallCard.name,
                                    type_line: scryfallCard.type_line,
                                    image_url: scryfallCard.image_uris?.normal || scryfallCard.card_faces?.[0]?.image_uris?.normal,
                                    scryfall_uri: scryfallCard.scryfall_uri,
                                    cmc: scryfallCard.cmc || 0,
                                    colors: scryfallCard.colors || []
                                });
                            }
                        }
                        processedItems++;
                        updateProgress(processedItems, totalItems, `- Loading cards (${deck.cards.length})`);
                    }
                }

                // Process tokens
                if (data.tokens) {
                    console.log('Moxfield tokens found:', Object.keys(data.tokens).length);
                    console.log('Token data sample:', Object.entries(data.tokens)[0]);
                    console.log('All token names:', Object.entries(data.tokens).map(([id, data]) => data?.card?.name || data?.name || id));
                    
                    for (const [cardId, cardData] of Object.entries(data.tokens)) {
                        // Token data might be structured differently - check if it has a card.name
                        const cardName = cardData?.card?.name || cardData?.name || cardId;
                        const moxfieldColors = cardData?.card?.colors || cardData?.colors || [];
                        
                        console.log('=== Token Debug ===');
                        console.log('Card ID:', cardId);
                        console.log('Card Name:', cardName);
                        console.log('Full cardData:', JSON.stringify(cardData, null, 2));
                        console.log('Extracted colors:', moxfieldColors);
                        console.log('==================');
                        
                        if (!cardName || typeof cardName !== 'string' || cardName.trim() === '') {
                            console.log('Skipping invalid token name:', cardId, cardData);
                            continue;
                        }
                        
                        console.log('Fetching token:', cardName, 'Colors from Moxfield:', moxfieldColors);
                        const scryfallCard = await fetchCardByName(cardName, true, moxfieldColors); // Pass colors to find correct variant
                        if (scryfallCard) {
                            console.log('Scryfall returned:', scryfallCard.name, '-', scryfallCard.type_line);
                            
                            // Only add if it's actually a token or emblem
                            // Real tokens/emblems on Scryfall have specific patterns:
                            // 1. Type includes "Token" (e.g., "Token Creature — Human")
                            // 2. Type includes "Emblem" (e.g., "Emblem — Ob Nixilis")
                            // 3. Type is exactly "Card" (some older tokens)
                            // 4. Type is exactly "Creature" (some tokens like Morph)
                            // AND they always have CMC = 0
                            
                            const typeIsTokenOrEmblem = scryfallCard.type_line && (
                                scryfallCard.type_line.includes('Token') ||
                                scryfallCard.type_line.includes('Emblem') ||
                                scryfallCard.type_line === 'Card' ||
                                scryfallCard.type_line === 'Creature'
                            );
                            
                            const hasCMC0 = scryfallCard.cmc === 0;
                            
                            // Additional safety: if it has a mana_cost field (even if 0), it's probably not a token/emblem
                            const hasManaCost = scryfallCard.mana_cost && scryfallCard.mana_cost !== '';
                            
                            const isTokenOrEmblem = typeIsTokenOrEmblem && hasCMC0 && !hasManaCost;
                            
                            if (isTokenOrEmblem) {
                                // For double-faced cards, use the correct face based on colors or name
                                let imageUrl = scryfallCard.image_uris?.normal;
                                let actualColors = scryfallCard.colors || [];
                                
                                // If no direct image and it's a double-faced card
                                if (!imageUrl && scryfallCard.card_faces) {
                                    // First, try to match by color if we have moxfield colors
                                    let matchingFace = null;
                                    
                                    if (moxfieldColors && moxfieldColors.length > 0) {
                                        const sortedMoxColors = [...moxfieldColors].sort().join('');
                                        matchingFace = scryfallCard.card_faces.find(face => {
                                            const faceColors = (face.colors || []).sort().join('');
                                            return faceColors === sortedMoxColors;
                                        });
                                        console.log('Trying to match face by color:', sortedMoxColors, 'Found:', matchingFace ? matchingFace.name : 'none');
                                    }
                                    
                                    // Fallback: match by name
                                    if (!matchingFace) {
                                        matchingFace = scryfallCard.card_faces.find(face => 
                                            face.name.toLowerCase() === cardName.toLowerCase()
                                        );
                                        console.log('Trying to match face by name:', cardName, 'Found:', matchingFace ? matchingFace.name : 'none');
                                    }
                                    
                                    if (matchingFace) {
                                        imageUrl = matchingFace.image_uris?.normal;
                                        actualColors = matchingFace.colors || [];
                                        console.log('Using matching face:', matchingFace.name, 'Colors:', actualColors);
                                    } else {
                                        // Default to first face if no match
                                        imageUrl = scryfallCard.card_faces[0]?.image_uris?.normal;
                                        actualColors = scryfallCard.card_faces[0]?.colors || [];
                                        console.log('No matching face found, using first face with colors:', actualColors);
                                    }
                                }
                                
                                if (!imageUrl) {
                                    console.log('⚠ Warning: No image URL found for token:', scryfallCard.name);
                                }
                                
                                // Only add unique tokens/emblems
                                // Check for duplicates considering color identity
                                const exists = deck.tokens.find(t => 
                                    t.name === scryfallCard.name && 
                                    JSON.stringify(t.colors.sort()) === JSON.stringify(actualColors.sort())
                                );
                                if (!exists) {
                                    console.log('✓ Adding other card:', scryfallCard.name, 'Colors:', actualColors, 'Image:', imageUrl ? 'found' : 'MISSING');
                                    deck.tokens.push({
                                        id: scryfallCard.id,
                                        name: scryfallCard.name,
                                        type_line: scryfallCard.type_line,
                                        image_url: imageUrl,
                                        scryfall_uri: scryfallCard.scryfall_uri,
                                        cmc: scryfallCard.cmc || 0,
                                        colors: actualColors
                                    });
                                } else {
                                    console.log('⊗ Skipping duplicate:', scryfallCard.name);
                                }
                            } else {
                                console.log('✗ Skipping non-token/emblem card:', scryfallCard.name, '-', scryfallCard.type_line);
                            }
                        } else {
                            console.log('✗ Failed to fetch from Scryfall:', cardName);
                        }
                        processedItems++;
                        updateProgress(processedItems, totalItems, `- Loading other cards (${deck.tokens.length})`);
                    }
                    console.log('Total tokens added:', deck.tokens.length);
                } else {
                    console.log('No tokens in Moxfield data');
                }

                updateFilename();
                saveDecks();
                updateDeckSelector();
                renderDeck();
                showNotification('Deck imported successfully!', 'success');

            } catch (error) {
                console.error('Import error:', error);
                showNotification(error.message || 'Failed to import deck. Please try again.', 'error', 'Import Failed', 6000);
            } finally {
                hideLoadingOverlay();
            }
        }

        function extractMoxfieldId(url) {
            const match = url.match(/moxfield\.com\/decks\/([a-zA-Z0-9_-]+)/);
            return match ? match[1] : null;
        }

        async function fetchCardByName(name, preferToken = false, preferredColors = null) {
            // Skip invalid card names
            if (!name || typeof name !== 'string' || name.trim() === '') {
                console.warn('Invalid card name:', name);
                return null;
            }

            try {
                // Add delay to avoid rate limiting (Scryfall allows ~10 requests per second)
                await new Promise(resolve => setTimeout(resolve, 200));
                
                // If preferToken is true, search for token version first
                if (preferToken) {
                    try {
                        // Use Scryfall's layout:token filter for more accurate token search
                        const searchResponse = await fetch(`https://api.scryfall.com/cards/search?q=${encodeURIComponent(`!"${name.trim()}" layout:token`)}`);
                        if (searchResponse.ok) {
                            const searchData = await searchResponse.json();
                            if (searchData.data && searchData.data.length > 0) {
                                // If we have preferred colors, filter for matching tokens
                                if (preferredColors && preferredColors.length > 0) {
                                    const sortedPreferredColors = [...preferredColors].sort().join('');
                                    const matchingToken = searchData.data.find(card => {
                                        const cardColors = (card.colors || []).sort().join('');
                                        return cardColors === sortedPreferredColors;
                                    });
                                    if (matchingToken) {
                                        console.log(`Fetched ${matchingToken.name} with matching colors (${preferredColors}): CMC=${matchingToken.cmc}`);
                                        return matchingToken;
                                    }
                                }
                                // Return first result if no color match needed or found
                                const card = searchData.data[0];
                                console.log(`Fetched ${card.name} (token layout search): CMC=${card.cmc}, Colors=${card.colors}`);
                                return card;
                            }
                        }
                    } catch (e) {
                        console.log('Token layout search failed, trying type search...');
                    }
                    
                    // Fallback: try type:token search
                    try {
                        const searchResponse = await fetch(`https://api.scryfall.com/cards/search?q=${encodeURIComponent(`!"${name.trim()}" t:token`)}`);
                        if (searchResponse.ok) {
                            const searchData = await searchResponse.json();
                            if (searchData.data && searchData.data.length > 0) {
                                // If we have preferred colors, filter for matching tokens
                                if (preferredColors && preferredColors.length > 0) {
                                    const sortedPreferredColors = [...preferredColors].sort().join('');
                                    const matchingToken = searchData.data.find(card => {
                                        const cardColors = (card.colors || []).sort().join('');
                                        return cardColors === sortedPreferredColors;
                                    });
                                    if (matchingToken) {
                                        console.log(`Fetched ${matchingToken.name} with matching colors (${preferredColors}): CMC=${matchingToken.cmc}`);
                                        return matchingToken;
                                    }
                                }
                                const card = searchData.data[0];
                                console.log(`Fetched ${card.name} (token type search): CMC=${card.cmc}, Colors=${card.colors}`);
                                return card;
                            }
                        }
                    } catch (e) {
                        console.log('Token type search failed, falling back to exact match');
                    }
                }
                
                // Properly encode the card name for URL
                const encodedName = encodeURIComponent(name.trim());
                const response = await fetch(`https://api.scryfall.com/cards/named?exact=${encodedName}`);
                
                if (!response.ok) {
                    console.warn(`Card not found on Scryfall: "${name}" (${response.status})`);
                    return null;
                }
                
                const card = await response.json();
                console.log(`Fetched ${card.name}: CMC=${card.cmc}, Colors=${card.colors}`);
                return card;
            } catch (error) {
                console.error(`Error fetching "${name}":`, error);
                return null;
            }
        }

        // Render deck
        function renderDeck() {
            const deck = getCurrentDeck();
            
            // Render commander
            const commanderList = document.getElementById('commanderList');
            if (deck.commander) {
                commanderList.innerHTML = '';
                commanderList.appendChild(createDeckCard(deck.commander, true, false, 1));
            } else {
                commanderList.innerHTML = '<div class="empty-state">No commander selected</div>';
            }

            // Get sort settings
            const sortBy = document.getElementById('sortBy').value;
            const sortOrder = document.getElementById('sortOrder').value;

            // Filter cards by category
            const filteredCards = currentFilter === 'all' ? 
                deck.cards : 
                deck.cards.filter(card => card.type_line.includes(currentFilter));

            // Render main deck
            const deckList = document.getElementById('deckList');
            
            if (filteredCards.length === 0) {
                deckList.innerHTML = '<div class="empty-state">No cards in this category</div>';
            } else {
                // Group cards by name
                const groupedCards = groupCardsByName(filteredCards);
                
                // Sort grouped cards
                const sortedCards = sortCards(groupedCards, sortBy, sortOrder);
                
                deckList.innerHTML = '';
                sortedCards.forEach(group => {
                    deckList.appendChild(createDeckCard(group.card, false, false, group.count, group.ids));
                });
            }

            // Update count
            document.getElementById('deckCount').textContent = `${deck.cards.length}/99`;

            // Render tokens
            const tokenSection = document.getElementById('tokenSection');
            const tokenList = document.getElementById('tokenList');
            if (deck.tokens.length > 0) {
                tokenSection.style.display = 'block';
                
                // Group and sort tokens
                const groupedTokens = groupCardsByName(deck.tokens);
                const sortedTokens = sortCards(groupedTokens, sortBy, sortOrder);
                
                tokenList.innerHTML = '';
                sortedTokens.forEach(group => {
                    tokenList.appendChild(createDeckCard(group.card, false, true, group.count, group.ids));
                });
                document.getElementById('tokenCount').textContent = deck.tokens.length;
            } else {
                tokenSection.style.display = 'none';
            }
        }

        function createDeckCard(card, isCommander, isToken = false, count = 1, ids = null) {
            const div = document.createElement('div');
            div.className = 'deck-card';
            div.dataset.cardId = card.id;
            if (ids) {
                div.dataset.cardIds = JSON.stringify(ids);
            }
            
            div.innerHTML = `
                <img src="${card.image_url}" alt="${card.name}" class="deck-card-image" loading="lazy">
                <div class="deck-card-overlay"></div>
                <div class="deck-card-name">${card.name}</div>
                ${count > 1 ? `<div class="deck-card-count">×${count}</div>` : ''}
                <button class="deck-card-remove" title="Remove card">×</button>
                <button class="deck-card-alt-art" title="Change artwork">🎨</button>
            `;

            const altArtBtn = div.querySelector('.deck-card-alt-art');
            altArtBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                openAltArtModal(card, isCommander, isToken);
            });

            const removeBtn = div.querySelector('.deck-card-remove');
            removeBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                // If this is a grouped card, remove just one instance
                if (ids && ids.length > 0) {
                    removeCard(ids[0], isCommander, isToken);
                } else {
                    removeCard(card.id, isCommander, isToken);
                }
            });

            // Hover preview
            div.addEventListener('mouseenter', (e) => showCardPreview(card.image_url, e));
            div.addEventListener('mousemove', (e) => moveCardPreview(e));
            div.addEventListener('mouseleave', hideCardPreview);

            return div;
        }

        function removeCard(cardId, isCommander, isToken) {
            const deck = getCurrentDeck();
            
            if (isCommander) {
                deck.commander = null;
                updateFilename();
            } else if (isToken) {
                deck.tokens = deck.tokens.filter(c => c.id !== cardId);
            } else {
                const index = deck.cards.findIndex(c => c.id === cardId);
                if (index !== -1) {
                    deck.cards.splice(index, 1);
                }
            }

            saveDecks();
            updateDeckSelector();
            renderDeck();
        }

        function highlightCards(query) {
            document.querySelectorAll('.deck-card').forEach(card => {
                const nameElement = card.querySelector('.deck-card-name');
                if (!nameElement) return;
                
                const name = nameElement.textContent.toLowerCase();
                if (query && !name.includes(query)) {
                    card.style.display = 'none';
                } else {
                    card.style.display = 'block';
                    if (query && name.includes(query)) {
                        card.classList.add('highlighted');
                    } else {
                        card.classList.remove('highlighted');
                    }
                }
            });
        }

        // Alt art modal
        async function openAltArtModal(card, isCommander, isToken) {
            currentAltArtCard = { card, isCommander, isToken };
            const modal = document.getElementById('altArtModal');
            const grid = document.getElementById('altArtGrid');
            
            modal.classList.add('active');
            grid.innerHTML = '<div class="loading">Loading alternate art...</div>';

            try {
                // First, try to get the card by exact name to find its Oracle ID
                const exactResponse = await fetch(`https://api.scryfall.com/cards/named?exact=${encodeURIComponent(card.name)}`);
                
                if (!exactResponse.ok) {
                    throw new Error('Card not found');
                }
                
                const exactCard = await exactResponse.json();
                const oracleId = exactCard.oracle_id;
                
                // Now fetch all prints using the Oracle ID
                const printsResponse = await fetch(`https://api.scryfall.com/cards/search?order=released&q=oracleid:${oracleId}&unique=prints`);
                const printsData = await printsResponse.json();

                if (printsData.data && printsData.data.length > 0) {
                    grid.innerHTML = '';
                    
                    // Sort by release date (newest first)
                    const sortedPrints = printsData.data.sort((a, b) => {
                        return new Date(b.released_at) - new Date(a.released_at);
                    });
                    
                    sortedPrints.forEach(print => {
                        const imageUrl = print.image_uris?.normal || print.card_faces?.[0]?.image_uris?.normal;
                        if (imageUrl) {
                            const div = document.createElement('div');
                            div.className = 'alt-art-option';
                            div.innerHTML = `
                                <img src="${imageUrl}" alt="${print.set_name}">
                                <div class="set-info">${print.set_name} (${print.set.toUpperCase()})</div>
                            `;
                            div.addEventListener('click', () => selectAltArt(imageUrl));
                            grid.appendChild(div);
                        }
                    });
                    
                    if (grid.children.length === 0) {
                        grid.innerHTML = '<div class="empty-state">No images found for this card</div>';
                    } else {
                        // Add info about number of printings found
                        const info = document.createElement('div');
                        info.style.cssText = 'text-align: center; padding: 1rem; color: var(--text-secondary); font-size: 0.9rem;';
                        info.textContent = `Found ${grid.children.length} printing(s)`;
                        grid.insertBefore(info, grid.firstChild);
                    }
                } else {
                    grid.innerHTML = '<div class="empty-state">No alternate printings found</div>';
                }
            } catch (error) {
                grid.innerHTML = '<div class="empty-state">Error loading alternate art. Try again.</div>';
                console.error('Alt art error:', error);
            }
        }

        // Card preview system
        let hidePreviewTimeout = null;
        let showPreviewTimeout = null;

        function showCardPreview(imageUrl, event) {
            // Don't show preview if imageUrl is missing
            if (!imageUrl) {
                return;
            }
            
            const preview = document.getElementById('cardPreview');
            const img = document.getElementById('previewImg');
            
            // Cancel any pending hide timeout
            if (hidePreviewTimeout) {
                clearTimeout(hidePreviewTimeout);
                hidePreviewTimeout = null;
            }
            
            // Cancel any pending show timeout and start fresh
            if (showPreviewTimeout) {
                clearTimeout(showPreviewTimeout);
                showPreviewTimeout = null;
            }
            
            // Show preview after a short delay
            showPreviewTimeout = setTimeout(() => {
                if (imageUrl) {
                    img.src = imageUrl;
                    preview.style.display = 'block';
                    preview.classList.remove('show');
                    
                    // Position the preview
                    updatePreviewPosition(event);
                    
                    // Fade in
                    requestAnimationFrame(() => {
                        requestAnimationFrame(() => {
                            preview.classList.add('show');
                        });
                    });
                }
                showPreviewTimeout = null;
            }, 200); // Small delay to prevent preview spam
        }

        function updatePreviewPosition(event) {
            const preview = document.getElementById('cardPreview');
            const previewWidth = 375; // Width of preview image
            const previewHeight = 525; // Approximate height (aspect ratio 5:7)
            
            // Get header height to avoid overlap
            const header = document.querySelector('.header');
            const headerHeight = header ? header.offsetHeight : 0;
            const minTopPosition = headerHeight + 10; // Header height + 10px margin
            
            let x = event.clientX + 20; // 20px to the right of cursor
            let y = event.clientY - 200; // Center vertically relative to cursor
            
            // Check if preview would go off right edge of screen
            if (x + previewWidth > window.innerWidth) {
                x = event.clientX - previewWidth - 20; // Show on left instead
            }
            
            // Check if preview would go off bottom edge
            if (y + previewHeight > window.innerHeight) {
                y = window.innerHeight - previewHeight - 10;
            }
            
            // Check if preview would go behind header
            if (y < minTopPosition) {
                y = minTopPosition;
            }
            
            preview.style.left = x + 'px';
            preview.style.top = y + 'px';
        }

        function moveCardPreview(event) {
            const preview = document.getElementById('cardPreview');
            
            // Only update position if preview is visible
            if (preview.style.display === 'block' && preview.classList.contains('show')) {
                updatePreviewPosition(event);
            }
        }

        function hideCardPreview() {
            // Cancel any pending show timeout
            if (showPreviewTimeout) {
                clearTimeout(showPreviewTimeout);
                showPreviewTimeout = null;
            }
            
            const preview = document.getElementById('cardPreview');
            preview.classList.remove('show');
            
            // Hide after fade transition completes
            if (hidePreviewTimeout) {
                clearTimeout(hidePreviewTimeout);
            }
            hidePreviewTimeout = setTimeout(() => {
                preview.style.display = 'none';
                hidePreviewTimeout = null;
            }, 100);
        }

        // Card grouping and sorting utilities
        function groupCardsByName(cards) {
            const grouped = {};
            cards.forEach(card => {
                // Create a unique key based on name and sorted colors
                const colorKey = (card.colors || []).sort().join('');
                const uniqueKey = `${card.name}|${colorKey}`;
                
                if (!grouped[uniqueKey]) {
                    grouped[uniqueKey] = {
                        card: card,
                        count: 0,
                        ids: []
                    };
                }
                grouped[uniqueKey].count++;
                grouped[uniqueKey].ids.push(card.id);
            });
            return Object.values(grouped);
        }

        function getColorOrder(card) {
            // WUBRG order: White=0, Blue=1, Black=2, Red=3, Green=4, Colorless=5
            const colorOrder = { 'W': 0, 'U': 1, 'B': 2, 'R': 3, 'G': 4 };
            
            if (!card.colors || card.colors.length === 0) {
                return 5; // Colorless
            }
            
            if (card.colors.length === 1) {
                return colorOrder[card.colors[0]] || 5;
            }
            
            // Multi-color: use the first color in WUBRG order
            for (const color of ['W', 'U', 'B', 'R', 'G']) {
                if (card.colors.includes(color)) {
                    return colorOrder[color];
                }
            }
            
            return 5;
        }

        function getManaCost(card) {
            // Get CMC from card data
            const cmc = card.cmc || 0;
            console.log(`Card: ${card.name}, CMC: ${cmc}`);
            return cmc;
        }

        function sortCards(cards, sortBy, sortOrder) {
            const sorted = [...cards];
            
            switch(sortBy) {
                case 'name':
                    sorted.sort((a, b) => a.card.name.localeCompare(b.card.name));
                    break;
                case 'color':
                    sorted.sort((a, b) => {
                        const colorA = getColorOrder(a.card);
                        const colorB = getColorOrder(b.card);
                        if (colorA !== colorB) return colorA - colorB;
                        return a.card.name.localeCompare(b.card.name);
                    });
                    break;
                case 'cmc':
                    sorted.sort((a, b) => {
                        const cmcA = a.card.cmc || 0;
                        const cmcB = b.card.cmc || 0;
                        console.log(`Comparing: ${a.card.name} (CMC: ${cmcA}) vs ${b.card.name} (CMC: ${cmcB})`);
                        if (cmcA !== cmcB) return cmcA - cmcB;
                        return a.card.name.localeCompare(b.card.name);
                    });
                    break;
            }
            
            if (sortOrder === 'desc') {
                sorted.reverse();
            }
            
            return sorted;
        }

        // Export to TTS
        function exportToTTS() {
            const deck = getCurrentDeck();
            
            if (!deck.commander) {
                showNotification('Please select a commander before exporting', 'warning', 'Missing Commander');
                return;
            }

            if (deck.cards.length !== 99) {
                // Show warning but allow export
                showNotification(`Your deck has ${deck.cards.length} cards instead of 99. Exporting anyway...`, 'warning', 'Deck Size Warning', 5000);
            }

            // Save the card back URL from the modal
            const newCardBackUrl = document.getElementById('cardBackUrlInput').value.trim();
            if (newCardBackUrl) {
                deck.cardBackUrl = newCardBackUrl;
                saveDecks();
                updateCardBackPreview();
            }

            const filename = document.getElementById('filenameInput').value || 'commander-deck.json';
            const ttsJson = generateTTSJson(deck);
            
            const blob = new Blob([JSON.stringify(ttsJson, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename.endsWith('.json') ? filename : filename + '.json';
            a.click();
            URL.revokeObjectURL(url);
            
            closeExportModal();
            showNotification('Deck exported successfully!', 'success');
        }

        function generateTTSJson(deck) {
            const cardWidth = 2.5;
            const cardHeight = 3.5;

            // Create ContainedObjects for main deck (99 cards)
            const containedObjects = [];
            const mainDeckCustomDeck = {};

            deck.cards.forEach((card, index) => {
                const cardId = (index + 1) * 100; // 100, 200, 300, etc.
                const deckKey = String(index + 1); // "1", "2", "3", etc.
                
                // Add to ContainedObjects array
                containedObjects.push({
                    CardID: cardId,
                    Name: "Card",
                    Nickname: card.name,
                    Transform: {
                        posX: 0,
                        posY: 0,
                        posZ: 0,
                        rotX: 0,
                        rotY: 180,
                        rotZ: 180,
                        scaleX: 1,
                        scaleY: 1,
                        scaleZ: 1
                    }
                });
                
                // Add to CustomDeck
                mainDeckCustomDeck[deckKey] = {
                    FaceURL: card.image_url,
                    BackURL: deck.cardBackUrl || "https://i.imgur.com/Hg8CwwU.jpeg",
                    NumHeight: 1,
                    NumWidth: 1,
                    BackIsHidden: true
                };
            });

            // Create DeckIDs array for main deck
            const mainDeckIDs = deck.cards.map((card, index) => (index + 1) * 100);

            // Create main deck object
            const mainDeckObj = {
                Name: "DeckCustom",
                ContainedObjects: containedObjects,
                DeckIDs: mainDeckIDs,
                CustomDeck: mainDeckCustomDeck,
                Transform: {
                    posX: 0,
                    posY: 1,
                    posZ: 0,
                    rotX: 0,
                    rotY: 180,
                    rotZ: 180,
                    scaleX: 1,
                    scaleY: 1,
                    scaleZ: 1
                }
            };

            // Create commander object (separate card, not in deck)
            const commanderObj = {
                CardID: 100,
                Name: "Card",
                Nickname: deck.commander.name,
                Transform: {
                    posX: 2.2,
                    posY: 1,
                    posZ: 0,
                    rotX: 0,
                    rotY: 180,
                    rotZ: 0,
                    scaleX: 1,
                    scaleY: 1,
                    scaleZ: 1
                },
                DeckIDs: [100],
                CustomDeck: {
                    "1": {
                        FaceURL: deck.commander.image_url,
                        BackURL: deck.cardBackUrl || "https://i.imgur.com/Hg8CwwU.jpeg",
                        NumHeight: 1,
                        NumWidth: 1,
                        BackIsHidden: true
                    }
                }
            };

            const objectStates = [mainDeckObj, commanderObj];

            // Create token deck if tokens exist
            if (deck.tokens && deck.tokens.length > 0) {
                const tokenContainedObjects = [];
                const tokenCustomDeck = {};
                
                deck.tokens.forEach((token, index) => {
                    const cardId = (index + 1) * 100;
                    const deckKey = String(index + 1);
                    
                    tokenContainedObjects.push({
                        CardID: cardId,
                        Name: "Card",
                        Nickname: token.name,
                        Transform: {
                            posX: 0,
                            posY: 0,
                            posZ: 0,
                            rotX: 0,
                            rotY: 180,
                            rotZ: 180,
                            scaleX: 1,
                            scaleY: 1,
                            scaleZ: 1
                        }
                    });
                    
                    tokenCustomDeck[deckKey] = {
                        FaceURL: token.image_url,
                        BackURL: deck.cardBackUrl || "https://i.imgur.com/Hg8CwwU.jpeg",
                        NumHeight: 1,
                        NumWidth: 1,
                        BackIsHidden: true
                    };
                });
                
                const tokenDeckIDs = deck.tokens.map((token, index) => (index + 1) * 100);
                
                const tokenDeckObj = {
                    Name: "DeckCustom",
                    ContainedObjects: tokenContainedObjects,
                    DeckIDs: tokenDeckIDs,
                    CustomDeck: tokenCustomDeck,
                    Transform: {
                        posX: 4.4,
                        posY: 1,
                        posZ: 0,
                        rotX: 0,
                        rotY: 180,
                        rotZ: 180,
                        scaleX: 1,
                        scaleY: 1,
                        scaleZ: 1
                    }
                };
                
                objectStates.push(tokenDeckObj);
            }

            return {
                ObjectStates: objectStates
            };
        }
