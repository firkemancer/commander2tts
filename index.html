// ─────────────────────────────────────────────────────────────────────────
// Card hover preview
// ─────────────────────────────────────────────────────────────────────────
let _hidePreviewTimeout = null;
let _showPreviewTimeout = null;
function showCardPreview(imageUrl, event) {
  if (!imageUrl) return;
  const preview = $('cardPreview');
  const img = $('previewImg');
  if (_hidePreviewTimeout) { clearTimeout(_hidePreviewTimeout); _hidePreviewTimeout = null; }
  if (_showPreviewTimeout) { clearTimeout(_showPreviewTimeout); _showPreviewTimeout = null; }
  _showPreviewTimeout = setTimeout(() => {
    img.src = imageUrl;
    preview.style.display = 'block';
    preview.classList.remove('show');
    updatePreviewPosition(event);
    requestAnimationFrame(() => requestAnimationFrame(() => preview.classList.add('show')));
    _showPreviewTimeout = null;
  }, 200);
}
function updatePreviewPosition(event) {
  const preview = $('cardPreview');
  const pw = 280, ph = 392;
  const header = document.querySelector('.topbar');
  const headerH = header ? header.offsetHeight : 0;
  let x = event.clientX + 20;
  let y = event.clientY - 150;
  if (x + pw > window.innerWidth) x = event.clientX - pw - 20;
  if (y + ph > window.innerHeight) y = window.innerHeight - ph - 10;
  if (y < headerH + 10) y = headerH + 10;
  preview.style.left = x + 'px';
  preview.style.top = y + 'px';
}
function moveCardPreview(event) {
  const preview = $('cardPreview');
  if (preview.style.display === 'block' && preview.classList.contains('show')) updatePreviewPosition(event);
}
function hideCardPreview() {
  if (_showPreviewTimeout) { clearTimeout(_showPreviewTimeout); _showPreviewTimeout = null; }
  const preview = $('cardPreview');
  preview.classList.remove('show');
  if (_hidePreviewTimeout) clearTimeout(_hidePreviewTimeout);
  _hidePreviewTimeout = setTimeout(() => { preview.style.display = 'none'; _hidePreviewTimeout = null; }, 100);
}

// ─────────────────────────────────────────────────────────────────────────
// Modal infrastructure
// ─────────────────────────────────────────────────────────────────────────
const _modalStack = []; // top of stack is topmost open

function openModal(opts) {
  // opts: { id?, className?, content (HTMLElement), onClose? }
  const root = $('modalRoot');
  const backdrop = el('div', { class: 'modal-backdrop' });
  const modal = el('div', { class: 'modal' + (opts.className ? ' ' + opts.className : '') });
  modal.appendChild(opts.content);
  backdrop.appendChild(modal);
  if (opts.id) backdrop.dataset.modalId = opts.id;
  backdrop.addEventListener('click', e => {
    if (e.target === backdrop) closeModal(backdrop);
  });
  root.appendChild(backdrop);
  _modalStack.push({ backdrop, onClose: opts.onClose });
  return backdrop;
}
function closeModal(backdrop) {
  if (!backdrop) {
    const top = _modalStack.pop();
    if (!top) return false;
    if (top.onClose) top.onClose();
    top.backdrop.remove();
    return true;
  }
  const i = _modalStack.findIndex(m => m.backdrop === backdrop);
  if (i === -1) return false;
  const entry = _modalStack.splice(i, 1)[0];
  if (entry.onClose) entry.onClose();
  entry.backdrop.remove();
  return true;
}
function closeTopmostModal() {
  if (_modalStack.length === 0) return false;
  const top = _modalStack[_modalStack.length - 1];
  return closeModal(top.backdrop);
}

function buildModalShell(titleText, body, footChildren) {
  const head = el('div', { class: 'modal-head' }, [
    el('h2', {}, titleText),
    el('button', { class: 'modal-close', 'aria-label': 'Close', onclick: () => closeTopmostModal() }, [icon('close')])
  ]);
  const bodyEl = el('div', { class: 'modal-body' });
  if (Array.isArray(body)) body.forEach(c => bodyEl.appendChild(c));
  else if (body) bodyEl.appendChild(body);
  const out = el('div', { class: 'modal-shell' }, [head, bodyEl]);
  if (footChildren) {
    out.appendChild(el('div', { class: 'modal-foot' }, footChildren));
  }
  return out;
}

// Generic confirm dialog
function showConfirmDialog(opts) {
  // opts: { title, message (HTML), confirmLabel, confirmClass?, onConfirm, listHtml? }
  const body = el('div', { class: 'modal-body', style: { width: '480px', maxWidth: '100%' } });
  body.appendChild(el('p', { html: opts.message, style: { color: 'var(--ink-2)', lineHeight: '1.5', margin: 0 } }));
  if (opts.listHtml) {
    const list = el('div', { class: 'confirm-list', html: opts.listHtml });
    body.appendChild(list);
  }
  const foot = el('div', { class: 'modal-foot' }, [
    el('button', { class: 'btn ghost', onclick: () => closeTopmostModal() }, 'Cancel'),
    el('button', {
      class: 'btn ' + (opts.confirmClass || 'primary'),
      onclick: () => { closeTopmostModal(); opts.onConfirm && opts.onConfirm(); }
    }, opts.confirmLabel || 'Confirm')
  ]);
  const head = el('div', { class: 'modal-head' }, [
    el('h2', {}, opts.title),
    el('button', { class: 'modal-close', onclick: () => closeTopmostModal() }, [icon('close')])
  ]);
  openModal({ content: el('div', { class: 'modal-shell' }, [head, body, foot]) });
}

// ─────────────────────────────────────────────────────────────────────────
// Modal: Import deck
// ─────────────────────────────────────────────────────────────────────────
function openImportModal() {
  const moxInput = el('input', { class: 'input', placeholder: 'https://moxfield.com/decks/abc123…' });

  const moxCard = el('div', { class: 'import-card' }, [
    el('h3', {}, 'From Moxfield'),
    el('p', {}, "Paste a public Moxfield deck URL. We'll pull the decklist and fetch card data from Scryfall."),
    el('div', { style: { display: 'flex', gap: '8px' } }, [
      moxInput,
      el('button', { class: 'btn primary', onclick: async () => {
        const url = moxInput.value.trim();
        if (!url) { showNotification('Please enter a Moxfield URL', 'warning'); return; }
        const id = extractMoxfieldId(url);
        if (!id) { showNotification('Please enter a valid Moxfield deck URL', 'error', 'Invalid URL'); return; }
        closeTopmostModal();
        await importFromMoxfield(id);
      }}, 'Import')
    ])
  ]);
  moxInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      e.preventDefault();
      moxCard.querySelector('.btn.primary').click();
    }
  });

  const fileInput = el('input', { type: 'file', accept: '.json', style: { display: 'none' } });
  fileInput.addEventListener('change', async (e) => {
    const f = e.target.files[0];
    if (!f) return;
    closeTopmostModal();
    await handleJsonFile(f);
  });
  const dropzone = el('div', { class: 'dropzone',
    onclick: () => fileInput.click(),
    ondragover: (e) => { e.preventDefault(); dropzone.classList.add('dragover'); },
    ondragleave: () => dropzone.classList.remove('dragover'),
    ondrop: async (e) => {
      e.preventDefault();
      dropzone.classList.remove('dragover');
      const f = e.dataTransfer.files[0];
      if (f && f.name.toLowerCase().endsWith('.json')) {
        closeTopmostModal();
        await handleJsonFile(f);
      } else {
        showNotification('Please drop a valid JSON file', 'error');
      }
    }
  }, [

async function importFromMoxfield(deckId) {
  showLoading('Importing from Moxfield', 'Reaching out across the planes…');
  try {
    let data = null;
    const moxUrl = `https://api.moxfield.com/v2/decks/all/${deckId}`;
    try {
      const direct = await fetch(moxUrl);
      if (direct.ok) data = await direct.json();
    } catch {}
    if (!data) {
      const proxies = [
        `https://corsproxy.io/?${encodeURIComponent(moxUrl)}`,
        `https://api.allorigins.win/get?url=${encodeURIComponent(moxUrl)}`,
      ];
      for (const p of proxies) {
        try {
          const resp = await fetch(p);
          if (resp.ok) {
            const result = await resp.json();
            data = result.contents ? JSON.parse(result.contents) : result;
            if (data) break;
          }
        } catch {}
      }
    }
    if (!data) throw new Error('Could not fetch deck data. Try a different deck or import via TTS JSON.');

    // Reuse current deck if empty, else new (enforce tab cap)
    let deck;
    const current = getCurrentDeck();
    if (current && isDeckEmpty(current)) {
      deck = current;
      deck.cards = []; deck.tokens = []; deck.commanders = [];
    } else {
      if (getOpenCount() >= MAX_OPEN_TABS) {
        throw new Error(`You can have at most ${MAX_OPEN_TABS} decks open at once. Close one first.`);
      }
      deck = createNewDeck();
      deck.cards = []; deck.tokens = []; deck.commanders = [];
      STATE.decks.push(deck);
      STATE.currentDeckIndex = STATE.decks.length - 1;
    }
    if (data.name) deck.name = data.name;

    const cmdCount = data.commanders ? Object.keys(data.commanders).length : 0;
    const mbCount  = data.mainboard  ? Object.keys(data.mainboard).length  : 0;
    const totalItems = cmdCount + mbCount;
    let processed = 0;

    const names = [];
    if (data.commanders) Object.keys(data.commanders).forEach(n => { if (n && typeof n === 'string') names.push(n); });
    if (data.mainboard)  Object.keys(data.mainboard).forEach(n => { if (n && typeof n === 'string') names.push(n); });

    updateProgress(0, totalItems, '- Pre-fetching card data…');
    const cardCache = await fetchCardsByNameBatch(names);

    if (data.commanders) {
      for (const [name] of Object.entries(data.commanders)) {
        if (!name || typeof name !== 'string') continue;
        const k = name.toLowerCase().trim();
        const scry = cardCache.has(k) ? cardCache.get(k) : await fetchCardByName(name);
        if (scry) deck.commanders.push(buildCardEntry(scry));
        processed++;
        updateProgress(processed, totalItems, `- Loading commander(s) (${deck.commanders.length})`);
      }
    }
    if (data.mainboard) {
      for (const [name, info] of Object.entries(data.mainboard)) {
        if (!name || typeof name !== 'string') continue;
        const k = name.toLowerCase().trim();
        const scry = cardCache.has(k) ? cardCache.get(k) : await fetchCardByName(name);
        if (scry) {
          const qty = info.quantity || 1;
          for (let i = 0; i < qty; i++) deck.cards.push(buildCardEntry(scry));
        }
        processed++;
        updateProgress(processed, totalItems, `- Loading cards (${deck.cards.length})`);
      }
    }

    updateProgress(processed, totalItems, '- Detecting tokens…');
    await autoDetectTokens(deck, [...cardCache.values()]);

    saveDecks();
    renderAll();
    showNotification('Deck imported successfully!', 'success');
  } catch (e) {
    console.error('Moxfield import error:', e);
    if (e.isScryfallDown) {
      showNotification(e.message, 'error', 'Scryfall Error', 8000);
    } else {
      showNotification(e.message || 'Failed to import deck. Please try again.', 'error', 'Import Failed', 6000);
    }
  } finally {
    hideLoading();
  }
}

async function handleJsonFile(file) {
  try {
    const text = await file.text();
    const json = JSON.parse(text);
    showLoading('Importing JSON', 'Conjuring the cards…');
    await importFromTTSJson(json, file.name);
    hideLoading();
    showNotification('Deck imported successfully from JSON!', 'success');
  } catch (e) {
    hideLoading();
    console.error('JSON import error:', e);
    if (e.isScryfallDown) {
      showNotification(e.message, 'error', 'Scryfall Error', 8000);
    } else {
      showNotification('Failed to import JSON file. Please check the file format.', 'error');
    }
  }
}

async function importFromTTSJson(ttsJson, fileName = '') {
  let deck;
  const current = getCurrentDeck();
  if (current && isDeckEmpty(current)) {
    deck = current;
    deck.cards = []; deck.tokens = []; deck.commanders = [];
  } else {
    if (getOpenCount() >= MAX_OPEN_TABS) {
      throw new Error(`You can have at most ${MAX_OPEN_TABS} decks open at once. Close one first.`);
    }
    deck = createNewDeck();
    deck.cards = []; deck.tokens = []; deck.commanders = [];
    STATE.decks.push(deck);
    STATE.currentDeckIndex = STATE.decks.length - 1;
  }
  if (!ttsJson.ObjectStates || !Array.isArray(ttsJson.ObjectStates)) {
    throw new Error('Invalid TTS JSON format');
  }
  const objectStates = ttsJson.ObjectStates;
  const hasC2TTSData = objectStates.some(obj => {
    if (obj.C2TTSData) return true;
    if (obj.ContainedObjects) return obj.ContainedObjects.some(c => c.C2TTSData);
    return false;
  });
  if (hasC2TTSData) {
    await importFromC2TTSJson(deck, objectStates);
  } else {
    await importFromLegacyTTSJson(deck, objectStates);
  }
  const fileBase = fileName ? fileName.replace(/\.json$/i, '') : '';
  deck.name = ttsJson.C2TTSName || fileBase || 'Imported Deck';
  saveDecks();
  renderAll();
}

async function importFromC2TTSJson(deck, objectStates) {
  let total = 0, processed = 0;
  objectStates.forEach(obj => {
    if (obj.Name === 'DeckCustom' && obj.ContainedObjects) total += obj.ContainedObjects.length;
    else if (obj.Name === 'Card') total++;
  });

  for (const obj of objectStates) {
    if (obj.Name === 'DeckCustom' && obj.ContainedObjects && obj.CustomDeck) {
      for (const co of obj.ContainedObjects) {
        const meta = co.C2TTSData;
        const cardId = co.CardID;
        const key = String(Math.floor(cardId / 100));
        const face = obj.CustomDeck[key]?.FaceURL;
        if (meta && face) {
          const data = {
            id: meta.id || '', name: meta.name || co.Nickname,
            type_line: meta.type_line || '', image_url: face,
            scryfall_uri: meta.scryfall_uri || '', cmc: meta.cmc || 0,
            colors: meta.colors || [], color_identity: meta.color_identity || [],
            keywords: meta.keywords || [], legalities: meta.legalities || {}
          };
          if (!isScryfallUrl(face)) addCustomArt(data.name, face);
          if (meta.commander) deck.commanders.push(data);
          else if (meta.other) deck.tokens.push(data);
          else deck.cards.push(data);
        }
        processed++;
        updateProgress(processed, total, `- Importing cards (${processed}/${total})`);
      }
    } else if (obj.Name === 'Card') {
      const meta = obj.C2TTSData;
      const key = obj.DeckIDs && obj.DeckIDs.length > 0 ? String(Math.floor(obj.DeckIDs[0] / 100)) : '1';
      const face = obj.CustomDeck?.[key]?.FaceURL;
      if (meta && face) {
        const data = {
          id: meta.id || '', name: meta.name || obj.Nickname,
          type_line: meta.type_line || '', image_url: face,
          scryfall_uri: meta.scryfall_uri || '', cmc: meta.cmc || 0,
          colors: meta.colors || [], color_identity: meta.color_identity || [],
          keywords: meta.keywords || [], legalities: meta.legalities || {}
        };
        if (!isScryfallUrl(face)) addCustomArt(data.name, face);
        if (meta.commander) deck.commanders.push(data);
        else if (meta.other) deck.tokens.push(data);
        else deck.cards.push(data);
      }
      processed++;
      updateProgress(processed, total, `- Importing cards (${processed}/${total})`);
    }
  }
}

async function importFromLegacyTTSJson(deck, objectStates) {
  let total = 0, processed = 0;
  objectStates.forEach(obj => {
    if (obj.Name === 'DeckCustom' && obj.ContainedObjects) total += obj.ContainedObjects.length;
    else if (obj.Name === 'Card') total++;
  });

  const allNames = [];
  for (const obj of objectStates) {
    if (obj.Name === 'DeckCustom' && obj.ContainedObjects) {
      obj.ContainedObjects.forEach(c => { if (c.Nickname) allNames.push(c.Nickname); });
    } else if (obj.Name === 'Card' && obj.Nickname) {
      allNames.push(obj.Nickname);
    }
  }
  updateProgress(0, total, '- Pre-fetching card data…');
  const cardCache = await fetchCardsByNameBatch(allNames);

  for (const obj of objectStates) {
    if (obj.Name === 'DeckCustom' && obj.ContainedObjects && obj.CustomDeck) {
      for (const co of obj.ContainedObjects) {
        const name = co.Nickname;
        const cardId = co.CardID;
        const key = String(Math.floor(cardId / 100));
        const face = obj.CustomDeck[key]?.FaceURL;
        if (name && face) {
          const k = name.toLowerCase().trim();
          const scry = cardCache.has(k) ? cardCache.get(k) : await fetchCardByName(name);
          if (scry) {
            const isLikelyCmd = obj.Transform?.posX < 3 && obj.Transform?.posX > -3 && obj.ContainedObjects.length === 1;
            if (!isScryfallUrl(face)) addCustomArt(scry.name, face);
            const entry = buildCardEntry(scry);
            entry.image_url = face;
            if (isLikelyCmd && deck.commanders.length < 2) deck.commanders.push(entry);
            else deck.cards.push(entry);
          }
          processed++;
          updateProgress(processed, total, `- Importing cards (${processed}/${total})`);
        }
      }
    } else if (obj.Name === 'Card' && obj.Nickname) {
      const name = obj.Nickname;
      const key = obj.DeckIDs && obj.DeckIDs.length > 0 ? String(Math.floor(obj.DeckIDs[0] / 100)) : '1';
      const face = obj.CustomDeck?.[key]?.FaceURL;
      if (name && face) {
        const k = name.toLowerCase().trim();
        const scry = cardCache.has(k) ? cardCache.get(k) : await fetchCardByName(name);
        if (scry && deck.commanders.length < 2) {
          if (!isScryfallUrl(face)) addCustomArt(scry.name, face);
          const entry = buildCardEntry(scry);
          entry.image_url = face;
          deck.commanders.push(entry);
        }
        processed++;
        updateProgress(processed, total, `- Importing cards (${processed}/${total})`);
      }
    }
  }
  updateProgress(total, total, '- Detecting tokens…');
  await autoDetectTokens(deck, [...cardCache.values()]);
}

function openExportModal() {
  const deck = getCurrentDeck();
  if (!deck.commanders || deck.commanders.length === 0) {
    showNotification('Please select a commander before exporting', 'warning', 'Missing Commander');
  }
  const filename = defaultFilenameFor(deck);
  const cardBackUrl = deck.cardBackUrl || DEFAULT_CARD_BACK;

  const filenameInput = el('input', { class: 'input', value: filename });
  const backInput = el('input', { class: 'input', value: cardBackUrl });
  const backImg = el('img', { src: cardBackUrl, alt: 'Card back', onerror: function() { this.style.display = 'none'; } });
  backInput.addEventListener('input', () => {
    const u = backInput.value.trim();
    if (u && isValidUrl(u)) {
      const img = new Image();
      img.onload = () => { backImg.src = u; backImg.style.display = ''; };
      img.src = u;
    }
  });

  const total = (deck.commanders?.length || 0) + deck.cards.length + (deck.tokens?.length || 0);
  const commanderNames = (deck.commanders || []).map(c => c.name).join(' & ') || '—';

  const summary = el('div', { class: 'export-summary' }, [
    el('div', { class: 'kv' }, [
      el('span', { class: 'k' }, 'Deck'),
      el('span', { class: 'v', style: { fontFamily: "'Spectral', serif", fontSize: '18px' } }, deck.name)
    ]),
    el('div', { class: 'kv' }, [
      el('span', { class: 'k' }, 'Commander'),
      el('span', { class: 'v' }, commanderNames)
    ]),
    el('div', { class: 'kv' }, [
      el('span', { class: 'k' }, 'Cards'),
      el('span', { class: 'v', html: `<span class="mono">${total}</span> total — <span class="mono">${deck.commanders?.length || 0}</span> commander · <span class="mono">${deck.cards.length}</span> main · <span class="mono">${deck.tokens?.length || 0}</span> tokens` })
    ]),
    el('div', { style: { marginTop: '6px' } }, [
      el('div', { class: 'eyebrow', style: { marginBottom: '6px' } }, 'Filename'),
      filenameInput
    ]),
    el('div', { style: { marginTop: '6px' } }, [
      el('div', { class: 'eyebrow', style: { marginBottom: '6px' } }, 'Card Back URL'),
      el('div', { class: 'card-back-row' }, [
        el('div', { class: 'card-back-thumb' }, [backImg]),
        el('div', {}, [backInput])
      ])
    ])
  ]);

  const body = el('div', { class: 'modal-body', style: { width: '560px', maxWidth: '100%' } }, [summary]);
  const head = el('div', { class: 'modal-head' }, [
    el('h2', {}, 'Export to Tabletop Simulator'),
    el('button', { class: 'modal-close', onclick: () => closeTopmostModal() }, [icon('close')])
  ]);

  const doRealExport = async () => {
    const fn = (filenameInput.value || filename).trim();
    const back = (backInput.value || DEFAULT_CARD_BACK).trim();
    if (back) {
      const ok = await isValidImageUrl(back);
      if (!ok) {
        showNotification('Card back URL is not a valid image.', 'warning');
        return;
      }
      deck.cardBackUrl = back;
      saveDecks();
    }
    // Run validation first; if issues exist, show confirm
    const issues = validateDeck(deck);
    const doIt = () => {
      const json = generateTTSJson(deck);
      const blob = new Blob([JSON.stringify(json, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = fn.endsWith('.json') ? fn : fn + '.json';
      a.click();
      URL.revokeObjectURL(url);
      closeTopmostModal();
      showNotification('Deck exported successfully!', 'success');
    };
    if (issues.length === 0) { doIt(); return; }

    const errors = issues.filter(i => i.type === 'error').length;
    const warns  = issues.filter(i => i.type === 'warning').length;
    const summaryParts = [];
    if (errors > 0) summaryParts.push(`${errors} error${errors > 1 ? 's' : ''}`);
    if (warns > 0)  summaryParts.push(`${warns} warning${warns > 1 ? 's' : ''}`);
    let listHtml = '';
    issues.forEach(iss => {
      listHtml += `<div class="issue ${iss.type}"><span class="material-icons">${iss.icon}</span><div><b>${escapeHtml(iss.message)}</b>${iss.detail ? `<div class="det">${escapeHtml(iss.detail)}</div>` : ''}</div></div>`;
    });
    showConfirmDialog({
      title: `${summaryParts.join(' and ')} found`,
      message: 'Your deck has the following issues:',
      listHtml,
      confirmLabel: 'Export Anyway',
      confirmClass: 'danger',
      onConfirm: doIt
    });
  };

  const foot = el('div', { class: 'modal-foot' }, [
    el('button', { class: 'btn ghost', onclick: () => closeTopmostModal() }, 'Cancel'),
    el('button', { class: 'btn primary', onclick: doRealExport }, [icon('save'), document.createTextNode(' Save .json')])
  ]);
  openModal({ content: el('div', { class: 'modal-shell' }, [head, body, foot]) });
}

function generateTTSJson(deck) {
  const containedObjects = [];
  const mainCustomDeck = {};
  deck.cards.forEach((card, index) => {
    const cardId = (index + 1) * 100;
    const deckKey = String(index + 1);
    containedObjects.push({
      CardID: cardId,
      Name: 'Card',
      Nickname: card.name,
      C2TTSData: {
        id: card.id, name: card.name, type_line: card.type_line,
        scryfall_uri: card.scryfall_uri, cmc: card.cmc || 0,
        colors: card.colors || [], color_identity: card.color_identity || [],
        keywords: card.keywords || [], legalities: card.legalities || {},
        commander: false, other: false
      },
      Transform: { posX: 0, posY: 0, posZ: 0, rotX: 0, rotY: 180, rotZ: 180, scaleX: 1, scaleY: 1, scaleZ: 1 }
    });
    mainCustomDeck[deckKey] = {
      FaceURL: card.image_url, BackURL: deck.cardBackUrl || DEFAULT_CARD_BACK,
      NumHeight: 1, NumWidth: 1, BackIsHidden: true, UniqueBack: false
    };
  });
  const mainDeckIDs = deck.cards.map((c, i) => (i + 1) * 100);
  const mainDeckObj = {
    Name: 'DeckCustom', ContainedObjects: containedObjects, DeckIDs: mainDeckIDs, CustomDeck: mainCustomDeck,
    Transform: { posX: 0, posY: 1, posZ: 0, rotX: 0, rotY: 180, rotZ: 180, scaleX: 1, scaleY: 1, scaleZ: 1 }
  };
  const objectStates = [mainDeckObj];

  (deck.commanders || []).forEach((cmd, ci) => {
    objectStates.push({
      CardID: 100, Name: 'Card', Nickname: cmd.name,
      C2TTSData: {
        id: cmd.id, name: cmd.name, type_line: cmd.type_line,
        scryfall_uri: cmd.scryfall_uri, cmc: cmd.cmc || 0,
        colors: cmd.colors || [], color_identity: cmd.color_identity || [],
        keywords: cmd.keywords || [], legalities: cmd.legalities || {},
        commander: true, other: false
      },
      Transform: { posX: 2.2 + (ci * 2.2), posY: 1, posZ: 0, rotX: 0, rotY: 180, rotZ: 0, scaleX: 1, scaleY: 1, scaleZ: 1 },
      DeckIDs: [100],
      CustomDeck: { '1': {
        FaceURL: cmd.image_url, BackURL: deck.cardBackUrl || DEFAULT_CARD_BACK,
        NumHeight: 1, NumWidth: 1, BackIsHidden: true, UniqueBack: false
      }}
    });
  });

  if (deck.tokens && deck.tokens.length > 0) {
    const tokenContained = [];
    const tokenCustomDeck = {};
    deck.tokens.forEach((t, i) => {
      const cardId = (i + 1) * 100;
      const key = String(i + 1);
      tokenContained.push({
        CardID: cardId, Name: 'Card', Nickname: t.name,
        C2TTSData: {
          id: t.id, name: t.name, type_line: t.type_line,
          scryfall_uri: t.scryfall_uri, cmc: t.cmc || 0,
          colors: t.colors || [], commander: false, other: true
        },
        Transform: { posX: 0, posY: 0, posZ: 0, rotX: 0, rotY: 180, rotZ: 180, scaleX: 1, scaleY: 1, scaleZ: 1 }
      });
      tokenCustomDeck[key] = {
        FaceURL: t.image_url, BackURL: deck.cardBackUrl || DEFAULT_CARD_BACK,
        NumHeight: 1, NumWidth: 1, BackIsHidden: true, UniqueBack: false
      };
    });
    objectStates.push({
      Name: 'DeckCustom', ContainedObjects: tokenContained,
      DeckIDs: deck.tokens.map((t, i) => (i + 1) * 100),
      CustomDeck: tokenCustomDeck,
      Transform: { posX: 2.2 + ((deck.commanders?.length || 0) * 2.2), posY: 1, posZ: 0, rotX: 0, rotY: 180, rotZ: 0, scaleX: 1, scaleY: 1, scaleZ: 1 }
    });
  }

  return { C2TTSName: deck.name || 'Unnamed Deck', ObjectStates: objectStates };
}

// Modal: Alt art picker

async function openAltArtModal(card, isCommander, isToken, count = 1, indices = null) {
  STATE.altArt = {
    card, isCommander, isToken, count, indices,
    mode: 'all', currentCopy: 0, changed: false,
    activeUrl: card.image_url || null,
  };

  // Save current url as custom if non-Scryfall
  if (card.image_url && !isScryfallUrl(card.image_url)) addCustomArt(card.name, card.image_url);
  if (indices && indices.length > 0) {
    const deck = getCurrentDeck();
    const arr = isToken ? deck.tokens : deck.cards;
    indices.forEach(idx => {
      const c = arr[idx];
      if (c && c.image_url && !isScryfallUrl(c.image_url)) addCustomArt(card.name, c.image_url);
    });
  }

  // Detect mixed art among copies
  let mixed = false;
  if (count > 1 && indices && indices.length > 1) {
    const deck = getCurrentDeck();
    const arr = isToken ? deck.tokens : deck.cards;
    const first = arr[indices[0]]?.image_url;
    mixed = indices.some(idx => arr[idx]?.image_url !== first);
    if (mixed) STATE.altArt.mode = 'individual';
  }

  const previewImg = el('img', { src: card.image_url || '', alt: card.name });
  const thumbsEl = el('div', { class: 'alt-thumbs' });
  thumbsEl.innerHTML = '<div class="loading-row">Loading alternate art…</div>';

  // Header: card name + (if grouped) copy navigator
  const copyNav = el('div', { class: 'copies', style: { display: (count > 1 && !isCommander) ? '' : 'none' } });
  const copyPrev = el('button', { title: 'Previous copy' }, [icon('chevron_left')]);
  const copyLabel = el('span', { class: 'count' }, '1/' + count);
  const copyNext = el('button', { title: 'Next copy' }, [icon('chevron_right')]);
  copyNav.appendChild(copyPrev); copyNav.appendChild(copyLabel); copyNav.appendChild(copyNext);
  const updateCopyLabel = () => { copyLabel.textContent = `${STATE.altArt.currentCopy + 1}/${count}`; };
  copyPrev.addEventListener('click', () => {
    if (!indices || indices.length === 0) return;
    STATE.altArt.currentCopy = (STATE.altArt.currentCopy - 1 + indices.length) % indices.length;
    updateCopyLabel();
    refreshActiveFromCopy();
  });
  copyNext.addEventListener('click', () => {
    if (!indices || indices.length === 0) return;
    STATE.altArt.currentCopy = (STATE.altArt.currentCopy + 1) % indices.length;
    updateCopyLabel();
    refreshActiveFromCopy();
  });

  // Toggle (Apply individually)
  const indivToggle = el('div', { class: 'toggle' + (STATE.altArt.mode === 'individual' ? ' on' : ''),
    onclick: () => {
      const newMode = STATE.altArt.mode === 'all' ? 'individual' : 'all';
      STATE.altArt.mode = newMode;
      indivToggle.classList.toggle('on', newMode === 'individual');
      copyNav.style.display = (newMode === 'individual' && count > 1) ? '' : 'none';
      if (newMode === 'all' && indices && indices.length > 1) {
        // sync all to first copy's art
        const deck = getCurrentDeck();
        const arr = isToken ? deck.tokens : deck.cards;
        const first = arr[indices[0]]?.image_url;
        if (first) {
          indices.forEach(idx => { if (arr[idx]) arr[idx].image_url = first; });
          saveDecks();
          STATE.altArt.changed = true;
          STATE.altArt.activeUrl = first;
          previewImg.src = first;
          renumberThumbsActive();
        }
      } else {
        refreshActiveFromCopy();
      }
    }
  });
  const indivRow = el('div', { style: { display: (count > 1 && !isCommander) ? 'flex' : 'none', alignItems: 'center', gap: '12px', marginBottom: '10px', flexShrink: '0' } }, [
    indivToggle,
    el('span', { style: { fontSize: '12.5px', color: 'var(--ink-2)' } }, 'Apply individually'),
    el('span', { style: { fontSize: '11.5px', color: 'var(--ink-3)' } }, 'Each copy gets its own art')
  ]);

  const refreshActiveFromCopy = () => {
    if (STATE.altArt.mode === 'individual' && indices && indices.length > 0) {
      const deck = getCurrentDeck();
      const arr = isToken ? deck.tokens : deck.cards;
      const cur = arr[indices[STATE.altArt.currentCopy]];
      if (cur) {
        STATE.altArt.activeUrl = cur.image_url;
        previewImg.src = cur.image_url;
        renumberThumbsActive();
      }
    }
  };

  const renumberThumbsActive = () => {
    [...thumbsEl.children].forEach(c => {
      c.classList.toggle('active', c.dataset.imageUrl === STATE.altArt.activeUrl);
    });
  };

  const onSelect = (url) => {
    const deck = getCurrentDeck();
    STATE.altArt.activeUrl = url;
    previewImg.src = url;
    STATE.altArt.changed = true;
    renumberThumbsActive();

    if (isCommander) {
      const c = deck.commanders.find(c => c.id === card.id);
      if (c) c.image_url = url;
    } else if (STATE.altArt.mode === 'individual' && indices && indices.length > 1) {
      const arr = isToken ? deck.tokens : deck.cards;
      const ti = indices[STATE.altArt.currentCopy];
      if (arr[ti]) arr[ti].image_url = url;
    } else {
      const arr = isToken ? deck.tokens : deck.cards;
      if (indices && indices.length > 0) {
        indices.forEach(idx => { if (arr[idx]) arr[idx].image_url = url; });
      } else {
        arr.forEach(c => { if (c.id === card.id) c.image_url = url; });
      }
    }
    saveDecks();
  };

  const reorderThumbs = () => {
    const favs = getAltArtFavorites()[card.name] || [];
    const custs = getCustomArt(card.name);
    const entries = [...thumbsEl.children];
    entries.sort((a, b) => {
      const aFav = favs.includes(a.dataset.imageUrl), bFav = favs.includes(b.dataset.imageUrl);
      const aCu  = custs.includes(a.dataset.imageUrl), bCu = custs.includes(b.dataset.imageUrl);
      if (aFav && !bFav) return -1;
      if (!aFav && bFav) return 1;
      if (aCu && !bCu) return -1;
      if (!aCu && bCu) return 1;
      return 0;
    });
    entries.forEach(e => thumbsEl.appendChild(e));
  };

  const makeThumb = (imageUrl, label, isCustom) => {
    const isFav = isArtFavorited(card.name, imageUrl);
    const isActive = STATE.altArt.activeUrl === imageUrl;
    const t = el('div', {
      class: 'alt-thumb' + (isActive ? ' active' : ''),
      dataset: { imageUrl },
      onclick: () => onSelect(imageUrl)
    }, [
      el('img', { src: imageUrl, alt: label }),
      el('span', { class: 'tag' }, label)
    ]);
    if (isFav) t.classList.add('fav');
    const favBtn = el('button', {
      class: 'fav-btn' + (isFav ? ' on' : ''),
      title: 'Favorite',
      onclick: (e) => {
        e.stopPropagation();
        toggleArtFavorite(card.name, imageUrl);
        const nowFav = isArtFavorited(card.name, imageUrl);
        favBtn.classList.toggle('on', nowFav);
        t.classList.toggle('fav', nowFav);
        const sym = favBtn.querySelector('.material-icons');
        sym.textContent = nowFav ? 'star' : 'star_border';
        reorderThumbs();
      }
    }, [icon(isFav ? 'star' : 'star_border')]);
    t.appendChild(favBtn);
    if (isCustom) {
      const rm = el('button', {
        class: 'rm-btn',
        title: 'Remove custom art',
        onclick: (e) => {
          e.stopPropagation();
          showConfirmDialog({
            title: 'Remove Custom Art',
            message: 'Are you sure you want to remove this custom art?',
            confirmLabel: 'Remove',
            confirmClass: 'danger',
            onConfirm: () => {
              removeCustomArt(card.name, imageUrl);
              t.remove();
              showNotification('Custom art removed', 'success');
            }
          });
        }
      }, [icon('close')]);
      t.appendChild(rm);
    }
    return t;
  };

  // Custom URL input
  const customUrlInput = el('input', { class: 'input', placeholder: 'Paste a custom image URL…' });
  const customUrlBtn = el('button', { class: 'btn', onclick: async () => {
    const url = customUrlInput.value.trim();
    if (!url) { showNotification('Please enter an image URL', 'warning'); return; }
    if (!isValidUrl(url)) { showNotification('Please enter a valid URL', 'warning'); return; }
    const valid = await isValidImageUrl(url);
    if (!valid) { showNotification('URL does not point to a valid image', 'warning'); return; }
    addCustomArt(card.name, url);
    if (![...thumbsEl.children].some(e => e.dataset.imageUrl === url)) {
      thumbsEl.appendChild(makeThumb(url, 'Custom Art', true));
      reorderThumbs();
    }
    onSelect(url);
    customUrlInput.value = '';
  } }, 'Use URL');
  customUrlInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); customUrlBtn.click(); } });

  // Build modal
  const left = el('div', { class: 'alt-preview' }, [
    el('div', { class: 'pcard' }, [previewImg]),
    el('div', { class: 'alt-meta' }, [
      el('h3', { class: 'name' }, card.name),
      copyNav
    ]),
  ]);

  const right = el('div', { class: 'alt-list' }, [
    el('div', { class: 'alt-list-head' }, [
      el('div', { class: 'eyebrow' }, 'Alternate art'),
      el('button', { class: 'btn ghost icon', title: 'Close', onclick: () => closeAltArtAndRefresh() }, [icon('close')])
    ]),
    indivRow,
    el('div', { class: 'alt-list-search' }, [customUrlInput, customUrlBtn]),
    thumbsEl
  ]);

  const grid = el('div', { class: 'alt-grid' }, [left, right]);

  const closeAltArtAndRefresh = () => {
    closeTopmostModal();
  };

  openModal({
    className: 'alt-modal',
    content: grid,
    onClose: () => {
      // Refresh the deck render if anything changed
      if (STATE.altArt.changed) {
        renderAll();
      }
    }
  });

  // Now fetch prints
  try {
    const exact = await fetch(`https://api.scryfall.com/cards/named?exact=${encodeURIComponent(card.name)}`);
    if (!exact.ok) throw new Error('Card not found');
    const exactCard = await exact.json();
    const oracleId = exactCard.oracle_id;
    const printsResp = await fetch(`https://api.scryfall.com/cards/search?order=released&q=oracleid:${oracleId}&unique=prints`);
    const printsData = await printsResp.json();

    thumbsEl.innerHTML = '';
    const addedUrls = new Set();
    const customs = new Set(getCustomArt(card.name));

    if (printsData.data && printsData.data.length > 0) {
      const sorted = printsData.data.sort((a, b) => new Date(b.released_at) - new Date(a.released_at));
      sorted.forEach(p => {
        const imgUrl = p.image_uris?.normal || p.card_faces?.[0]?.image_uris?.normal;
        if (imgUrl) {
          thumbsEl.appendChild(makeThumb(imgUrl, `${p.set_name} (${p.set.toUpperCase()})`, false));
          addedUrls.add(imgUrl);
        }
      });
    }
    customs.forEach(u => {
      if (!addedUrls.has(u)) {
        thumbsEl.appendChild(makeThumb(u, 'Custom Art', true));
        addedUrls.add(u);
      }
    });
    reorderThumbs();
    if (thumbsEl.children.length === 0) {
      thumbsEl.innerHTML = '<div class="empty">No alternate printings found</div>';
    }
  } catch (e) {
    console.error('Alt art error:', e);
    thumbsEl.innerHTML = '<div class="empty">Error loading alternate art. Try again.</div>';
  }
}

// ─────────────────────────────────────────────────────────────────────────
// Modal: Card search (popup)
// ─────────────────────────────────────────────────────────────────────────
function openSearchModal() {
  const inputEl = el('input', { class: 'input', placeholder: 'Search for a card…', autocomplete: 'off' });
  const resultsEl = el('div', { class: 'search-results' });
  let searchTimeout = null;

  inputEl.addEventListener('input', () => {
    clearTimeout(searchTimeout);
    const q = inputEl.value.trim();
    if (q.length < 2) { resultsEl.innerHTML = ''; return; }
    searchTimeout = setTimeout(() => doSearch(q), 300);
  });
  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      e.preventDefault();
      const first = resultsEl.querySelector('.search-result-row');
      if (first) first.click();
    }
  });

  const doSearch = async (q) => {
    resultsEl.innerHTML = '<div class="loading-row">Searching…</div>';
    try {
      const resp = await fetch(`https://api.scryfall.com/cards/search?q=${encodeURIComponent(q)}&unique=cards`);
      if (!resp.ok) {
        resultsEl.innerHTML = '<div class="empty">No cards found</div>';
        return;
      }
      const data = await resp.json();
      if (!data.data || data.data.length === 0) {
        resultsEl.innerHTML = '<div class="empty">No cards found</div>';
        return;
      }
      resultsEl.innerHTML = '';
      data.data.slice(0, 20).forEach(card => {
        const row = el('div', {
          class: 'search-result-row',
          onclick: () => addCardFromSearch(card),
          onmouseenter: (e) => showCardPreview(card.image_uris?.normal || card.card_faces?.[0]?.image_uris?.normal, e),
          onmousemove: (e) => moveCardPreview(e),
          onmouseleave: () => hideCardPreview()
        }, [
          el('div', { class: 'info' }, [
            el('div', { class: 'nm' }, card.name),
            el('div', { class: 'tp' }, card.type_line)
          ]),
          el('span', { class: 'cmc' }, String(card.cmc ?? 0))
        ]);
        resultsEl.appendChild(row);
      });
    } catch (e) {
      console.error('Search error:', e);
      resultsEl.innerHTML = '<div class="empty">Error searching cards</div>';
    }
  };

  const addCardFromSearch = (card) => {
    const deck = getCurrentDeck();
    const entry = buildCardEntry(card);
    if (canBeCommander(entry) && deck.commanders.length === 0) {
      deck.commanders.push(entry);
      showNotification(`${card.name} set as Commander`, 'success');
    } else if (canBeCommander(entry) && deck.commanders.length === 1 && hasPartner(deck.commanders[0]) && hasPartner(entry) && partnersCompatible(entry, deck.commanders[0])) {
      deck.commanders.push(entry);
      showNotification(`${card.name} set as Partner Commander`, 'success');
    } else {
      deck.cards.push(entry);
      showNotification(`${card.name} added`, 'success');
    }
    // Auto-detect tokens
    if (card.all_parts && card.all_parts.some(p => p.component === 'token')) {
      autoDetectTokens(deck, [card]).then(() => {
        saveDecks(); renderAll();
      }).catch(err => console.warn('Token auto-detect failed:', err));
    }
    saveDecks();
    renderAll();
  };

  const head = el('div', { class: 'modal-head' }, [
    el('h2', {}, 'Search Cards'),
    el('button', { class: 'modal-close', onclick: () => closeTopmostModal() }, [icon('close')])
  ]);
  const body = el('div', { class: 'modal-body' }, [
    el('div', { style: { display: 'flex', alignItems: 'center', gap: '8px' } }, [
      icon('search'),
      inputEl
    ]),
    resultsEl
  ]);
  body.querySelector('.material-icons').style.color = 'var(--ink-3)';

  openModal({
    className: 'search-modal',
    content: el('div', { class: 'modal-shell' }, [head, body])
  });
  setTimeout(() => inputEl.focus(), 50);
}

// Modal: Settings
// ─────────────────────────────────────────────────────────────────────────
function openSettingsModal() {
  const nav = el('div', { class: 'settings-nav' });
  const pane = el('div', { class: 'settings-pane' });

  const tabs = [
    { id: 'appearance', label: 'Appearance' },
    { id: 'themes',     label: 'Color Identity' },
    { id: 'data',       label: 'Data' },
    { id: 'about',      label: 'About' },
  ];
  const renderTab = (id) => {
    STATE.settingsTab = id;
    nav.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.tab === id));
    pane.innerHTML = '';
    if (id === 'appearance')   pane.appendChild(renderAppearanceTab());
    else if (id === 'themes')  pane.appendChild(renderThemesTab());
    else if (id === 'data')    pane.appendChild(renderDataTab());
    else                       pane.appendChild(renderAboutTab());
  };
  tabs.forEach(t => {
    nav.appendChild(el('button', {
      class: (STATE.settingsTab === t.id ? 'on' : ''), dataset: { tab: t.id },
      onclick: () => renderTab(t.id)
    }, t.label));
  });

  const head = el('div', { class: 'modal-head' }, [
    el('h2', {}, 'Settings'),
    el('button', { class: 'modal-close', onclick: () => closeTopmostModal() }, [icon('close')])
  ]);
  const grid = el('div', { class: 'settings-grid' }, [nav, pane]);
  openModal({
    className: 'settings-modal',
    content: el('div', { style: { display: 'flex', flexDirection: 'column', height: '100%' } }, [head, grid])
  });

  renderTab(STATE.settingsTab);
}

function renderAppearanceTab() {
  const isDark = localStorage.getItem('theme') === 'dark';
  const darkToggle = el('div', { class: 'toggle' + (isDark ? ' on' : ''),
    onclick: () => {
      const newVal = localStorage.getItem('theme') !== 'dark';
      toggleDarkMode(newVal);
      darkToggle.classList.toggle('on', newVal);
    }
  });
  const matchOn = isMatchCommanderColors();
  const matchToggle = el('div', { class: 'toggle' + (matchOn ? ' on' : ''),
    onclick: () => {
      const newVal = !isMatchCommanderColors();
      toggleMatchCommander(newVal);
      matchToggle.classList.toggle('on', newVal);
      applyTheme();
      renderTabs();
    }
  });

  return el('div', {}, [
    el('div', { class: 'eyebrow', style: { marginBottom: '10px' } }, 'Appearance'),
    el('div', { class: 'settings-row' }, [
      el('div', {}, [
        el('div', { class: 'lbl' }, 'Dark mode'),
        el('div', { class: 'desc' }, 'Toggle a darker theme for low-light use.')
      ]),
      darkToggle
    ]),
    el('div', { class: 'settings-row' }, [
      el('div', {}, [
        el('div', { class: 'lbl' }, 'Match commander colors'),
        el('div', { class: 'desc' }, "Automatically pick the theme that matches your active deck's commander color identity.")
      ]),
      matchToggle
    ]),
  ]);
}

function renderThemesTab() {
  const matchOn = isMatchCommanderColors();
  const currentColor = matchOn ? getThemeForDeck(getCurrentDeck()) : (localStorage.getItem('themeColor') || 'purple');
  const activeColors = THEME_COLORS[currentColor] || [];

  // Wheel SVG
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('viewBox', '0 0 280 280');

  // Connection lines between active colors
  const activePoints = WHEEL_POINTS.filter(p => activeColors.includes(p.id));
  if (activePoints.length >= 2) {
    for (let i = 0; i < activePoints.length; i++) {
      for (let j = i + 1; j < activePoints.length; j++) {
        const ln = document.createElementNS(ns, 'line');
        ln.setAttribute('x1', activePoints[i].x);
        ln.setAttribute('y1', activePoints[i].y);
        ln.setAttribute('x2', activePoints[j].x);
        ln.setAttribute('y2', activePoints[j].y);
        ln.setAttribute('stroke', 'var(--accent)');
        ln.setAttribute('stroke-width', '2');
        ln.setAttribute('opacity', '0.6');
        svg.appendChild(ln);
      }
    }
  }

  // Nodes
  WHEEL_POINTS.forEach(p => {
    const isOn = activeColors.includes(p.id);
    const c = document.createElementNS(ns, 'circle');
    c.setAttribute('cx', p.x);
    c.setAttribute('cy', p.y);
    c.setAttribute('r', isOn ? 24 : 18);
    c.setAttribute('fill', p.hex);
    c.setAttribute('class', 'color-node' + (isOn ? ' on' : ''));
    c.setAttribute('stroke', 'rgba(0,0,0,0.18)');
    c.setAttribute('stroke-width', '1');
    svg.appendChild(c);

    const t = document.createElementNS(ns, 'text');
    t.setAttribute('x', p.x);
    t.setAttribute('y', p.y + 4);
    t.setAttribute('text-anchor', 'middle');
    t.setAttribute('fill', p.id === 'W' ? '#3a3a3a' : 'white');
    t.setAttribute('font-family', 'IBM Plex Mono, monospace');
    t.setAttribute('font-size', '12');
    t.setAttribute('font-weight', '600');
    t.style.pointerEvents = 'none';
    t.textContent = p.id;
    svg.appendChild(t);
  });

  const wheel = el('div', { class: 'theme-wheel' }, [svg]);

  // Theme chips list
  const listEl = el('div', { class: 'theme-list' });
  THEME_GROUPS.forEach(g => {
    listEl.appendChild(el('h4', {}, g.label));
    const row = el('div', { class: 'theme-row' });
    g.items.forEach(t => {
      const sw = el('span', { class: 'sw' });
      t.swatch.forEach(c => sw.appendChild(el('i', { style: { background: c } })));
      const chip = el('button', {
        class: 'theme-chip' + (t.id === currentColor ? ' on' : ''),
        onclick: () => {
          setColorTheme(t.id);
          renderTab(STATE.settingsTab); // re-render to update wheel + chips
          renderTabs();
        }
      }, [sw, document.createTextNode(t.label)]);
      row.appendChild(chip);
    });
    listEl.appendChild(row);
  });

  // For convenience: function that lets re-render after chip click
  function renderTab(id) {
    // need to call the outer one; lookup via closure
    const evt = new CustomEvent('rerenderSettingsTab', { detail: id });
    document.dispatchEvent(evt);
  }

  const wrap = el('div', { class: 'theme-wheel-wrap' }, [wheel, listEl]);

  const matchedNote = matchOn
    ? el('div', { class: 'desc', style: { padding: '12px 14px', background: 'color-mix(in oklch, var(--accent) 8%, var(--surface))', border: '1px solid color-mix(in oklch, var(--accent) 30%, var(--rule))', borderRadius: '8px', marginBottom: '14px' } }, [
        icon('info'), document.createTextNode(' Theme is auto-matched to your commander\'s color identity. Selecting a theme below will turn off matching.')
      ])
    : null;
  if (matchedNote) matchedNote.querySelector('.material-icons').style.verticalAlign = 'middle';

  const out = el('div', {}, [
    el('div', { class: 'eyebrow', style: { marginBottom: '10px' } }, 'Color identity theme'),
    matchedNote,
    wrap
  ].filter(Boolean));
  return out;
}

// ─────────────────────────────────────────────────────────────────────────
// localStorage export/import/wipe
// ─────────────────────────────────────────────────────────────────────────
function exportLocalStorageData() {
  const data = {};
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k.startsWith('commander2tts') || k === 'theme' || k === 'themeColor') {
      data[k] = localStorage.getItem(k);
    }
  }
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'commander2tts-backup.json'; a.click();
  URL.revokeObjectURL(url);
  showNotification('Settings exported successfully', 'success');
}

function isLocalStorageEmpty() {
  try {
    const saved = JSON.parse(localStorage.getItem('commander2tts_decks') || '[]');
    const hasContent = Array.isArray(saved) && saved.some(d => {
      if (!d) return false;
      const hc = Array.isArray(d.cards) && d.cards.length > 0;
      const hcd = Array.isArray(d.commanders) && d.commanders.length > 0;
      const ht = Array.isArray(d.tokens) && d.tokens.length > 0;
      return hc || hcd || ht;
    });
    if (hasContent) return false;
    const f = JSON.parse(localStorage.getItem('commander2tts_favorites') || '{}');
    if (f && Object.keys(f).length > 0) return false;
    const ca = JSON.parse(localStorage.getItem('commander2tts_custom_art') || '{}');
    if (ca && Object.keys(ca).length > 0) return false;
    return true;
  } catch { return false; }
}

function importLocalStorageData(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    let data;
    try { data = JSON.parse(ev.target.result); }
    catch { showNotification('Invalid settings file', 'error'); return; }
    if (!data || typeof data !== 'object') {
      showNotification('Invalid settings file', 'error'); return;
    }
    if (isLocalStorageEmpty()) {
      try {
        Object.entries(data).forEach(([k, v]) => localStorage.setItem(k, v));
        showNotification('Settings imported. Reloading…', 'success');
        setTimeout(() => location.reload(), 800);
      } catch { showNotification('Invalid settings file', 'error'); }
      return;
    }
    showImportChoiceDialog(
      () => {
        try { mergeImport(data); showNotification('Backup merged. Reloading…', 'success'); setTimeout(() => location.reload(), 800); }
        catch { showNotification('Failed to merge backup', 'error'); }
      },
      () => {
        try { overwriteImport(data); showNotification('Backup imported. Reloading…', 'success'); setTimeout(() => location.reload(), 800); }
        catch { showNotification('Failed to import backup', 'error'); }
      }
    );
  };
  reader.readAsText(file);
  e.target.value = '';
}

function showImportChoiceDialog(onMerge, onOverwrite) {
  const head = el('div', { class: 'modal-head' }, [
    el('h2', {}, 'Import Backup'),
    el('button', { class: 'modal-close', onclick: () => closeTopmostModal() }, [icon('close')])
  ]);
  const body = el('div', { class: 'modal-body', style: { width: '460px', maxWidth: '100%' } }, [
    el('p', { style: { color: 'var(--ink-2)', margin: 0, lineHeight: '1.5' } }, 'You already have decks, favorites, or custom art saved.'),
    el('p', { style: { color: 'var(--ink-2)', marginTop: '10px', lineHeight: '1.5' } }, [
      el('b', {}, 'Merge'), document.createTextNode(" adds the backup's decks alongside yours and combines favorites and custom art."),
    ]),
    el('p', { style: { color: 'var(--ink-2)', marginTop: '6px', lineHeight: '1.5' } }, [
      el('b', {}, 'Overwrite'), document.createTextNode(' replaces all existing data with the backup.')
    ]),
  ]);
  const foot = el('div', { class: 'modal-foot' }, [
    el('button', { class: 'btn ghost', onclick: () => closeTopmostModal() }, 'Cancel'),
    el('button', { class: 'btn', style: { background: 'var(--good)', color: 'white', borderColor: 'var(--good)' }, onclick: () => { closeTopmostModal(); onMerge(); } }, 'Merge'),
    el('button', { class: 'btn danger', onclick: () => { closeTopmostModal(); onOverwrite(); } }, 'Overwrite')
  ]);
  openModal({ content: el('div', { class: 'modal-shell' }, [head, body, foot]) });
}

function overwriteImport(data) {
  const keys = [];
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k.startsWith('commander2tts') || k === 'theme' || k === 'themeColor') keys.push(k);
  }
  keys.forEach(k => localStorage.removeItem(k));
  Object.entries(data).forEach(([k, v]) => localStorage.setItem(k, v));
}

function mergeImport(data) {
  try {
    const localDecks = JSON.parse(localStorage.getItem('commander2tts_decks') || '[]');
    const importedDecks = JSON.parse(data['commander2tts_decks'] || '[]');
    if (Array.isArray(importedDecks) && importedDecks.length > 0) {
      const filtered = (Array.isArray(localDecks) ? localDecks : []).filter(d => {
        if (!d) return false;
        const hc = Array.isArray(d.cards) && d.cards.length > 0;
        const hcd = Array.isArray(d.commanders) && d.commanders.length > 0;
        const ht = Array.isArray(d.tokens) && d.tokens.length > 0;
        return hc || hcd || ht;
      });
      const merged = [...filtered, ...importedDecks];
      localStorage.setItem('commander2tts_decks', JSON.stringify(merged));
    }
  } catch {}
  ['commander2tts_favorites', 'commander2tts_custom_art'].forEach(key => {
    try {
      const local = JSON.parse(localStorage.getItem(key) || '{}');
      const imp = JSON.parse(data[key] || '{}');
      const merged = { ...local };
      Object.entries(imp).forEach(([cn, urls]) => {
        if (!Array.isArray(urls)) return;
        const ex = Array.isArray(merged[cn]) ? merged[cn] : [];
        merged[cn] = Array.from(new Set([...ex, ...urls]));
      });
      localStorage.setItem(key, JSON.stringify(merged));
    } catch {}
  });
  Object.entries(data).forEach(([k, v]) => {
    if (['commander2tts_decks', 'commander2tts_favorites', 'commander2tts_custom_art', 'theme', 'themeColor'].includes(k)) return;
    if (localStorage.getItem(k) === null) localStorage.setItem(k, v);
  });
}

function wipeLocalStorageData() {
  showConfirmDialog({
    title: 'Wipe All Data',
    message: 'This will delete all decks, favorites, custom art, and settings.<br><br>This action cannot be undone.',
    confirmLabel: 'Wipe All Data',
    confirmClass: 'danger',
    onConfirm: () => {
      const keys = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k.startsWith('commander2tts') || k === 'theme' || k === 'themeColor') keys.push(k);
      }
      keys.forEach(k => localStorage.removeItem(k));
      showNotification('All data wiped. Reloading…', 'success');
      setTimeout(() => location.reload(), 800);
    }
  });
}

// ─────────────────────────────────────────────────────────────────────────
// Modal: Deck library
// ─────────────────────────────────────────────────────────────────────────
function openDeckLibraryModal() {
  const head = el('div', { class: 'modal-head' }, [
    el('h2', {}, 'Deck Library'),
    el('button', { class: 'modal-close', onclick: () => closeTopmostModal() }, [icon('close')])
  ]);

  const statsWrap = el('div', { class: 'eyebrow', style: { marginBottom: '12px' } });
  const listWrap = el('div', { class: 'lib-list' });
  const body = el('div', { class: 'modal-body', style: { width: '600px', maxWidth: '100%' } });

  const refresh = () => {
    listWrap.innerHTML = '';
    statsWrap.innerHTML = '';
    const openCount = getOpenCount();
    const atCap = openCount >= MAX_OPEN_TABS;
    statsWrap.appendChild(el('span', {}, `${STATE.decks.length} total — ${openCount}/${MAX_OPEN_TABS} open`));

    if (STATE.decks.length === 0) {
      listWrap.appendChild(el('div', { class: 'empty' }, 'No decks saved.'));
      return;
    }

    STATE.decks.forEach((deck, idx) => {
      const isActive = idx === STATE.currentDeckIndex && deck.open;
      const colorId = getThemeForDeck(deck);
      const theme = THEME_GROUPS.flatMap(g => g.items).find(t => t.id === colorId) || { swatch: ['#9b7fd4'] };
      const pipStyle = `linear-gradient(135deg, ${theme.swatch[0]}, ${theme.swatch[theme.swatch.length-1]})`;
      const commanderName = deck.commanders[0]?.name || '— no commander —';
      const cardLine = `${deck.cards.length} cards${deck.tokens.length ? ' · ' + deck.tokens.length + ' tokens' : ''}`;

      // Build action buttons depending on open/closed state
      const actions = [];
      if (deck.open) {
        // Open deck: offer switch-to (only when not the active one)
        if (idx !== STATE.currentDeckIndex) {
          actions.push(el('button', {
            class: 'btn',
            title: 'Switch to this deck',
            onclick: () => {
              STATE.currentDeckIndex = idx;
              saveDecks();
              renderAll();
              closeTopmostModal();
            }
          }, [icon('arrow_forward'), document.createTextNode(' Switch to')]));
        } else {
          // Active deck — just show "Active" as a static badge
          actions.push(el('span', {
            class: 'btn ghost',
            style: { color: 'var(--accent)', fontWeight: '500', cursor: 'default' }
          }, [icon('check'), document.createTextNode(' Active')]));
        }
      } else {
        // Closed deck: offer Open button (disabled at cap)
        const openBtn = el('button', {
          class: 'btn' + (atCap ? ' disabled' : ''),
          title: atCap ? 'Close some tabs to open this deck' : 'Open in tab',
          disabled: atCap ? '' : null,
          onclick: atCap ? null : () => {
            if (openDeckInTab(idx, true)) {
              renderAll();
              closeTopmostModal();
            }
          }
        }, [icon('tab'), document.createTextNode(' Open')]);
        actions.push(openBtn);
      }
      // Duplicate (always enabled; at cap, duplicate is created closed)
      actions.push(el('button', {
        class: 'btn ghost icon',
        title: 'Duplicate deck',
        onclick: () => {
          const copy = JSON.parse(JSON.stringify(deck));
          copy.name = generateDuplicateName(deck.name || `Deck ${idx + 1}`);
          const atCapNow = getOpenCount() >= MAX_OPEN_TABS;
          copy.open = !atCapNow;
          STATE.decks.splice(idx + 1, 0, copy);
          if (!atCapNow && STATE.currentDeckIndex > idx) STATE.currentDeckIndex++;
          saveDecks();
          renderAll();
          refresh();
          if (atCapNow) {
            showNotification(`Duplicated as "${copy.name}". Find it in the Deck Library — too many tabs are open.`, 'info', 'Duplicated', 6000);
          } else {
            showNotification(`Duplicated as "${copy.name}"`, 'success');
          }
        }
      }, [icon('content_copy')]));
      // Delete (always)
      actions.push(el('button', {
        class: 'btn ghost icon danger',
        title: 'Delete deck',
        onclick: () => {
          if (isDeckEmpty(deck)) {
            deleteDeckAt(idx);
            refresh();
            renderAll();
            return;
          }
          showConfirmDialog({
            title: 'Delete Deck',
            message: `Are you sure you want to delete "<b style="color:var(--accent)">${escapeHtml(deck.name || `Deck ${idx + 1}`)}</b>"?<br><br>This action cannot be undone.`,
            confirmLabel: 'Delete',
            confirmClass: 'danger',
            onConfirm: () => {
              deleteDeckAt(idx);
              refresh();
              renderAll();
            }
          });
        }
      }, [icon('delete')]));

      const row = el('div', { class: 'lib-row' + (isActive ? ' active' : '') }, [
        el('span', { class: 'lib-pip', style: { background: pipStyle } }),
        el('div', {}, [
          el('div', { class: 'lib-name' }, deck.name || `Deck ${idx + 1}`),
          el('div', { class: 'lib-sub' }, [
            el('span', { style: { color: 'var(--ink-2)' } }, commanderName),
            el('span', {}, '·'),
            el('span', { class: 'mono' }, cardLine),
          ])
        ]),
        el('div', { class: 'lib-actions' }, actions)
      ]);
      listWrap.appendChild(row);
    });
  };

  body.appendChild(statsWrap);
  body.appendChild(listWrap);
  refresh();
  openModal({
    content: el('div', { class: 'modal-shell' }, [head, body])
  });
}

// Helper: generateDuplicateName produces "Foo (Copy)" / "Foo (Copy 2)" / …
function generateDuplicateName(sourceName) {
  const existing = new Set(STATE.decks.map(d => d.name));
  const base = sourceName.replace(/ \(Copy(?: \d+)?\)$/, '');
  let candidate = `${base} (Copy)`;
  let n = 2;
  while (existing.has(candidate)) {
    candidate = `${base} (Copy ${n})`;
    n++;
  }
  return candidate;
}

// Helper: delete the deck at idx, fixing the current-index pointer
function deleteDeckAt(idx) {
  const captured = STATE.decks[idx].name || `Deck ${idx + 1}`;
  STATE.decks.splice(idx, 1);
  if (STATE.decks.length === 0) {
    STATE.decks.push(createNewDeck());
    STATE.currentDeckIndex = 0;
  } else {
    if (STATE.currentDeckIndex > idx) {
      STATE.currentDeckIndex--;
    } else if (STATE.currentDeckIndex === idx) {
      if (STATE.currentDeckIndex >= STATE.decks.length) STATE.currentDeckIndex = STATE.decks.length - 1;
    }
    if (!STATE.decks[STATE.currentDeckIndex] || !STATE.decks[STATE.currentDeckIndex].open) {
      const openIndices = STATE.decks.map((d, i) => d.open ? i : -1).filter(i => i >= 0);
      if (openIndices.length > 0) {
        let next = openIndices.filter(i => i <= STATE.currentDeckIndex).pop();
        if (next === undefined) next = openIndices[0];
        STATE.currentDeckIndex = next;
      } else {
        STATE.decks[STATE.currentDeckIndex].open = true;
      }
    }
  }
  saveDecks();
  showNotification(`Deleted "${captured}"`, 'success');
}

// ─────────────────────────────────────────────────────────────────────────
// Modal: Rename deck
// ─────────────────────────────────────────────────────────────────────────
function openRenameDeckModal() {
  const deck = getCurrentDeck();
  const cur = deck.name || `Deck ${STATE.currentDeckIndex + 1}`;
  const input = el('input', { class: 'input', value: cur });
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); doSave(); }
  });
  const doSave = () => {
    const v = input.value.trim();
    if (!v) { showNotification('Please enter a deck name', 'error'); return; }
    deck.name = v;
    saveDecks();
    renderAll();
    closeTopmostModal();
    showNotification('Deck renamed', 'success');
  };
  const head = el('div', { class: 'modal-head' }, [
    el('h2', {}, 'Rename Deck'),
    el('button', { class: 'modal-close', onclick: () => closeTopmostModal() }, [icon('close')])
  ]);
  const body = el('div', { class: 'modal-body', style: { width: '420px', maxWidth: '100%' } }, [
    el('div', { class: 'eyebrow', style: { marginBottom: '6px' } }, 'Deck name'),
    input
  ]);
  const foot = el('div', { class: 'modal-foot' }, [
    el('button', { class: 'btn ghost', onclick: () => closeTopmostModal() }, 'Cancel'),
    el('button', { class: 'btn primary', onclick: doSave }, 'Save')
  ]);
  openModal({ content: el('div', { class: 'modal-shell' }, [head, body, foot]) });
  setTimeout(() => { input.focus(); input.select(); }, 50);
}

// ─────────────────────────────────────────────────────────────────────────
// Modal: Delete deck
// ─────────────────────────────────────────────────────────────────────────
function openDeleteDeckModal(idx) {
  const target = idx !== undefined ? idx : STATE.currentDeckIndex;
  const deck = STATE.decks[target];
  const deckName = deck.name || `Deck ${target + 1}`;
  const isEmpty = isDeckEmpty(deck);
  if (isEmpty) {
    deleteDeckAt(target);
    renderAll();
    return;
  }
  showConfirmDialog({
    title: 'Delete Deck',
    message: `Are you sure you want to delete "<b style="color:var(--accent)">${escapeHtml(deckName)}</b>"?<br><br>This action cannot be undone.`,
    confirmLabel: 'Delete',
    confirmClass: 'danger',
    onConfirm: () => {
      deleteDeckAt(target);
      renderAll();
    }
  });
}

// ─────────────────────────────────────────────────────────────────────────
// Background migrations
// ─────────────────────────────────────────────────────────────────────────
async function migrateColorIdentity() {
  const idsToFetch = new Set();
  const refs = [];
  STATE.decks.forEach((deck, di) => {
    ['commanders', 'cards'].forEach(arr => {
      (deck[arr] || []).forEach((card, ci) => {
        if (!card.color_identity && card.id) {
          idsToFetch.add(card.id);
          refs.push({ deckIdx: di, arrayName: arr, cardIdx: ci, id: card.id });
        }
      });
    });
  });
  if (idsToFetch.size === 0) return;
  const idMap = new Map();
  const ids = [...idsToFetch];
  for (let i = 0; i < ids.length; i += 75) {
    const batch = ids.slice(i, i + 75);
    await new Promise(r => setTimeout(r, 100));
    try {
      const resp = await scryfallFetchWithRetry(
        'https://api.scryfall.com/cards/collection',
        { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identifiers: batch.map(id => ({ id })) }) }
      );
      if (resp.ok) {
        const data = await resp.json();
        (data.data || []).forEach(c => idMap.set(c.id, c.color_identity || []));
      }
    } catch (e) {
      if (e.isScryfallDown) return;
    }
  }
  let updated = 0;
  refs.forEach(r => {
    const c = STATE.decks[r.deckIdx][r.arrayName][r.cardIdx];
    if (c && idMap.has(r.id)) { c.color_identity = idMap.get(r.id); updated++; }
  });
  if (updated > 0) {
    saveDecks();
    renderAll();
  }
}

// ─────────────────────────────────────────────────────────────────────────
// Event wiring
// ─────────────────────────────────────────────────────────────────────────
function isTypingInInput(target) {
  if (!target) return false;
  const tag = target.tagName;
  return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || target.isContentEditable;
}

function setupEventListeners() {
  $('importBtn').addEventListener('click', openImportModal);
  $('exportBtn').addEventListener('click', openExportModal);
  $('searchBtn').addEventListener('click', openSearchModal);
  $('settingsBtn').addEventListener('click', openSettingsModal);
  $('deckLibraryBtn').addEventListener('click', openDeckLibraryModal);
  $('newDeckBtn').addEventListener('click', () => {
    const atCap = getOpenCount() >= MAX_OPEN_TABS;
    const deck = createNewDeck();
    if (atCap) {
      // Create as closed; keep current active deck
      deck.open = false;
      STATE.decks.push(deck);
      saveDecks();
      renderAll();
      showNotification(`"${deck.name}" created. Find it in the Deck Library — too many tabs are open.`, 'info', 'New deck', 6000);
    } else {
      STATE.decks.push(deck);
      STATE.currentDeckIndex = STATE.decks.length - 1;
      saveDecks();
      renderAll();
      showNotification('New deck created', 'success');
    }
  });

  $('deckSearch').addEventListener('input', (e) => {
    STATE.deckSearch = e.target.value;
    renderDeck();
  });
  $('categorySelect').addEventListener('change', (e) => {
    STATE.filter = e.target.value;
    renderDeck();
  });
  $('sortBy').addEventListener('change', (e) => {
    STATE.sortBy = e.target.value;
    renderDeck();
  });
  $('sortOrder').addEventListener('change', (e) => {
    STATE.sortOrder = e.target.value;
    renderDeck();
  });

  // Keyboard shortcuts
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (closeTopmostModal()) e.preventDefault();
      return;
    }
    if (e.key === '/' && !isTypingInInput(e.target)) {
      const search = $('deckSearch');
      if (search) { e.preventDefault(); search.focus(); search.select(); }
    }
  });
}

// ─────────────────────────────────────────────────────────────────────────
// Init
// ─────────────────────────────────────────────────────────────────────────
function init() {
  loadDecks();
  applyTheme();
  setupEventListeners();
  renderAll();
  // Expose useful symbols for debugging
  window.STATE = STATE;
  window.renderAll = renderAll;
  // Fire-and-forget background migration
  migrateColorIdentity().catch(err => console.warn('Migration failed:', err));
}

// Wait for fonts and DOM to be ready
document.addEventListener('DOMContentLoaded', init);
if (document.readyState !== 'loading') init();
</script>
