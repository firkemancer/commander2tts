<script>
  // Load theme immediately to prevent flash
  (function() {
    const savedTheme = localStorage.getItem('theme');
    const savedColor = localStorage.getItem('themeColor');
    const matchCI = localStorage.getItem('commander2tts_themeMatchCI') === 'true';
    if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
    if (savedTheme) document.body && document.body.setAttribute('data-theme', savedTheme);
    if (savedColor && !matchCI) {
      document.documentElement.setAttribute('data-color', savedColor);
    }
  })();
</script>

/* Light mode tones derived from hues */
:root {
  --bg:        oklch(0.985 0.005 80);
  --bg-mat:    oklch(0.965 0.012 80);
  --surface:   oklch(0.995 0.003 80);
  --surface-2: oklch(0.94 0.012 80);
  --ink:       oklch(0.22 0.025 60);
  --ink-2:     oklch(0.45 0.020 60);
  --ink-3:     oklch(0.62 0.015 60);
  --rule:      oklch(0.88 0.012 60);
  --rule-2:    oklch(0.94 0.008 60);
  --accent:    var(--hue1);
  --accent-2:  var(--hue2);
  --accent-3:  var(--hue3);
  --good:      oklch(0.62 0.13 145);
  --warn:      oklch(0.72 0.16 80);
  --bad:       oklch(0.60 0.20 25);
  --foil:      linear-gradient(135deg, #f0e6c8 0%, #d4b878 30%, #b08840 55%, #d4b878 80%, #f0e6c8 100%);
  --shadow-sm: 0 1px 0 rgba(40,30,15,0.04), 0 1px 2px rgba(40,30,15,0.06);
  --shadow-md: 0 2px 4px rgba(40,30,15,0.06), 0 8px 24px rgba(40,30,15,0.08);
  --shadow-lg: 0 12px 28px rgba(40,30,15,0.10), 0 32px 80px rgba(40,30,15,0.12);
}

[data-theme="dark"] {
  --bg:        oklch(0.16 0.012 270);
  --bg-mat:    oklch(0.19 0.015 270);
  --surface:   oklch(0.22 0.018 270);
  --surface-2: oklch(0.27 0.020 270);
  --ink:       oklch(0.96 0.008 80);
  --ink-2:     oklch(0.78 0.014 80);
  --ink-3:     oklch(0.60 0.014 80);
  --rule:      oklch(0.32 0.015 270);
  --rule-2:    oklch(0.26 0.013 270);
  --shadow-sm: 0 1px 0 rgba(0,0,0,0.2), 0 1px 2px rgba(0,0,0,0.4);
  --shadow-md: 0 2px 4px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.45);
  --shadow-lg: 0 12px 28px rgba(0,0,0,0.4), 0 32px 80px rgba(0,0,0,0.55);
}

/* ─── Reset / base ─── */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  font-size: 14px;
  line-height: 1.45;
  color: var(--ink);
  background: var(--bg);
  background-image:
    radial-gradient(1200px 600px at 8% -10%, color-mix(in oklch, var(--accent) 12%, transparent), transparent 60%),
    radial-gradient(1000px 500px at 100% 110%, color-mix(in oklch, var(--accent-3) 10%, transparent), transparent 60%);
  background-attachment: fixed;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
input, select, textarea { font: inherit; color: inherit; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: color-mix(in oklch, var(--ink) 18%, transparent); border-radius: 999px; border: 2px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover { background-color: color-mix(in oklch, var(--ink) 35%, transparent); background-clip: padding-box; }

.serif { font-family: 'Spectral', Georgia, serif; }
.mono  { font-family: 'IBM Plex Mono', ui-monospace, monospace; }
.eyebrow { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); font-weight: 500; }

/* Material Icons font setup */
.material-icons {
  font-family: 'Material Icons';
  font-weight: normal; font-style: normal; font-size: 18px;
  line-height: 1; letter-spacing: normal; text-transform: none;
  display: inline-block; white-space: nowrap; word-wrap: normal; direction: ltr;
  -webkit-font-feature-settings: 'liga'; font-feature-settings: 'liga';
  -webkit-font-smoothing: antialiased;
}

/* ─── Layout shell ─── */
#app { height: 100vh; display: grid; grid-template-rows: auto 1fr; }

.topbar {
  display: grid; grid-template-columns: auto 1fr auto;
  align-items: center; gap: 20px;
  padding: 10px 22px;
  background: linear-gradient(180deg, color-mix(in oklch, var(--surface) 100%, transparent) 0%, color-mix(in oklch, var(--surface) 70%, transparent) 100%);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--rule);
  position: relative; z-index: 50;
}

.brand { display: flex; align-items: center; gap: 12px; }
.brand-logo {
  height: 32px; width: auto; display: block;
  filter: drop-shadow(0 1px 0 rgba(0,0,0,0.05));
}
[data-theme="dark"] .brand-logo { filter: drop-shadow(0 1px 0 rgba(0,0,0,0.5)); }
.brand-title {
  font-family: 'Spectral', serif; font-weight: 500;
  font-size: 18px; letter-spacing: -0.01em;
  color: var(--ink);
}

/* Deck tab strip */
.tab-strip {
  display: flex; align-items: stretch; min-width: 0;
  gap: 6px;
}
.tabs {
  display: flex; align-items: stretch; gap: 4px;
  min-width: 0; flex: 1 1 auto;
  overflow: hidden;
  padding-bottom: 14px;
  margin-bottom: -14px;
}
.tab {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 4px 6px 10px;
  border-radius: 8px 8px 0 0;
  border: 1px solid transparent;
  border-bottom: none;
  position: relative; top: 11px;
  max-width: 240px;
  min-width: 40px;
  background: transparent;
  transition: background 120ms;
  cursor: pointer;
  user-select: none;
  flex: 1 1 0;
}
.tab:hover { background: color-mix(in oklch, var(--ink) 5%, transparent); }
.tab.active {
  background: var(--bg);
  border-color: var(--rule);
  box-shadow: 0 -1px 0 var(--accent) inset, 0 -3px 0 var(--accent);
}
.tab .pip {
  width: 8px; height: 8px; border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), var(--accent-3));
  flex-shrink: 0;
}
.tab .label {
  font-family: 'Spectral', serif; font-size: 14px; font-weight: 500;
  line-height: 1.4; padding: 2px 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  min-width: 0; flex: 1 1 auto;
}
.tab .count { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-3); flex-shrink: 0; }
.tab .tab-close {
  width: 18px; height: 18px;
  display: grid; place-items: center;
  border-radius: 4px;
  color: var(--ink-3);
  opacity: 0; transition: all 120ms;
  flex-shrink: 0;
}
.tab:hover .tab-close, .tab.active .tab-close { opacity: 1; }
.tab .tab-close:hover { background: color-mix(in oklch, var(--ink) 12%, transparent); color: var(--ink); }
.tab .tab-close .material-icons { font-size: 13px; }
/* When tab is narrow, hide the count and close button to keep label visible */
.tab.narrow .count { display: none; }
.tab.narrow .tab-close { display: none; }
.tab.narrow.active .tab-close { display: grid; }

.tab-controls { display: flex; align-items: center; gap: 2px; flex-shrink: 0; }
.tab-ctrl {
  padding: 0 10px; align-self: center;
  color: var(--ink-3); line-height: 1;
  border-radius: 6px;
  display: inline-grid; place-items: center;
  height: 32px; min-width: 32px;
}
.tab-ctrl:hover { background: color-mix(in oklch, var(--ink) 8%, transparent); color: var(--ink); }
.tab-ctrl .material-icons { font-size: 18px; }
.tab-ctrl.has-hidden::after {
  content: ''; position: absolute; top: 7px; right: 6px;
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent);
}
.tab-ctrl { position: relative; }

.actions { display: flex; align-items: center; gap: 8px; }
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 14px; border-radius: 7px;
  font-size: 13px; font-weight: 500;
  border: 1px solid var(--rule);
  background: var(--surface);
  color: var(--ink);
  transition: all 120ms;
  white-space: nowrap;
}
.btn:hover { background: var(--surface-2); border-color: color-mix(in oklch, var(--ink) 22%, transparent); }
.btn.primary {
  background: linear-gradient(180deg, var(--accent), color-mix(in oklch, var(--accent) 80%, black));
  color: white; border-color: color-mix(in oklch, var(--accent) 70%, black);
  box-shadow: var(--shadow-sm);
}
.btn.primary:hover { filter: brightness(1.05); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: color-mix(in oklch, var(--ink) 7%, transparent); }
.btn.danger { color: var(--bad); border-color: color-mix(in oklch, var(--bad) 40%, var(--rule)); }
.btn.danger:hover { background: color-mix(in oklch, var(--bad) 10%, var(--surface)); }
.btn.icon { padding: 7px; width: 32px; justify-content: center; }
.btn .material-icons { font-size: 18px; line-height: 1; }
.btn:disabled, .btn.disabled { opacity: 0.45; cursor: not-allowed; }
.btn:disabled:hover, .btn.disabled:hover { background: var(--surface); border-color: var(--rule); filter: none; }

/* ─── Main workspace ─── */
.workspace {
  display: grid;
  grid-template-columns: 1fr 320px;
  min-height: 0;
  position: relative;
}

.canvas {
  overflow-y: auto;
  padding: 22px 32px 80px;
  min-height: 0;
}

.rail {
  border-left: 1px solid var(--rule);
  background: color-mix(in oklch, var(--surface) 70%, transparent);
  backdrop-filter: blur(6px);
  overflow-y: auto;
  padding: 24px 22px 40px;
  min-height: 0;
}

/* ─── Commander hero ─── */
.hero {
  display: grid; grid-template-columns: auto 1fr; gap: 24px;
  padding: 14px 0 22px;
  border-bottom: 1px solid var(--rule);
  margin-bottom: 22px;
}
.hero-card {
  width: 168px; aspect-ratio: 2.5 / 3.5;
  border-radius: 12px;
  position: relative;
  overflow: hidden;
  background: var(--surface-2);
  box-shadow: var(--shadow-lg);
  cursor: pointer;
  transition: transform 160ms;
}
.hero-card:hover { transform: translateY(-2px); }
.hero-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
.hero-card .hero-card-empty {
  position: absolute; inset: 0;
  display: grid; place-items: center;
  color: var(--ink-3);
  text-align: center; padding: 14px;
  font-family: 'Spectral', serif; font-style: italic; font-size: 13px;
}
.hero-card .hero-card-empty .material-icons {
  font-size: 36px; display: block; margin-bottom: 8px; opacity: 0.5;
}
.hero-info { display: flex; flex-direction: column; justify-content: space-between; min-width: 0; padding: 6px 0; }
.hero-info .crest {
  display: flex; align-items: center; gap: 8px;
  font-family: 'IBM Plex Mono', monospace; font-size: 10.5px;
  letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3);
}
.hero-info .crest .crest-name {
  cursor: pointer;
  border-radius: 4px;
  padding: 2px 6px;
  margin: -2px -6px;
  transition: background 120ms;
}
.hero-info .crest .crest-name:hover { background: color-mix(in oklch, var(--ink) 7%, transparent); color: var(--ink-2); }
.hero-info h1 {
  font-family: 'Spectral', serif; font-weight: 500;
  font-size: clamp(24px, 2.6vw, 38px);
  line-height: 1.05;
  letter-spacing: -0.015em;
  margin: 6px 0 4px;
  color: var(--ink);
  text-wrap: balance;
}
.hero-info .type { font-style: italic; color: var(--ink-2); font-family: 'Spectral', serif; font-size: 16px; }
.hero-info .flavor { color: var(--ink-2); font-size: 13.5px; margin-top: 10px; }
.hero-meta {
  display: flex; flex-wrap: wrap; gap: 8px 18px;
  margin-top: 18px;
  align-items: center;
}
.hero-meta .stat {
  display: inline-flex; align-items: baseline; gap: 7px;
  font-family: 'IBM Plex Mono', monospace; font-size: 11px;
  letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3);
}
.hero-meta .stat b { font-family: 'Spectral', serif; font-weight: 500; font-size: 18px; color: var(--ink); letter-spacing: 0; text-transform: none; }
.hero-empty {
  padding: 36px 22px;
  border: 1.5px dashed var(--rule);
  border-radius: 12px;
  margin-bottom: 22px;
  text-align: center;
  color: var(--ink-3);
}
.hero-empty .material-icons { font-size: 32px; color: var(--ink-3); display: block; margin-bottom: 8px; }
.hero-empty .ttl { font-family: 'Spectral', serif; font-size: 18px; color: var(--ink-2); font-style: italic; }
.hero-empty .sub { font-size: 12.5px; margin-top: 4px; }

/* ─── Section header ─── */
.section-head {
  display: flex; flex-wrap: wrap;
  align-items: center; justify-content: space-between; gap: 14px;
  margin-bottom: 14px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--rule);
}
.section-head .title {
  font-family: 'Spectral', serif; font-size: 22px; font-weight: 500;
  letter-spacing: -0.01em;
  display: inline-flex; align-items: baseline; gap: 12px;
  white-space: nowrap;
}
.section-head .title .num { font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: var(--ink-3); font-weight: 500; letter-spacing: 0; }
.section-head .toolbar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

.toolbar select {
  padding: 6px 24px 6px 10px;
  border-radius: 7px;
  border: 1px solid var(--rule);
  background: var(--surface);
  color: var(--ink);
  font-size: 12.5px;
  appearance: none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' stroke='currentColor' stroke-width='1.4' fill='none' stroke-linecap='round'/></svg>");
  background-repeat: no-repeat;
  background-position: right 8px center;
}
.toolbar input.input { max-width: 200px; padding: 5px 10px; font-size: 12.5px; }

/* ─── Card grid ─── */
.cardgrid { display: grid; gap: 14px; }
.cardgrid.grid    { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.cardgrid.medium  { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
.cardgrid.compact { grid-template-columns: 1fr; gap: 1px; }

/* ─── Card tile ─── */
.card {
  position: relative;
  background: var(--surface);
  border-radius: 10px;
  box-shadow: var(--shadow-sm);
  transition: transform 140ms cubic-bezier(.2,.6,.2,1), box-shadow 140ms;
  cursor: pointer;
  border: 1px solid var(--rule);
}
.card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); z-index: 2; }
.card.dimmed { opacity: 0.28; }
.card.highlighted { box-shadow: 0 0 0 2px var(--accent), var(--shadow-md); }
.card .art {
  aspect-ratio: 2.5 / 3.5;
  border-radius: 9px 9px 0 0;
  position: relative;
  overflow: hidden;
  background: var(--surface-2);
}
.card .art img {
  width: 100%; height: 100%; object-fit: cover; display: block;
}
.card.compact .art { display: none; }
.card .corner-cost {
  position: absolute; top: 8px; right: 8px; z-index: 2;
  display: inline-flex; padding: 3px 7px; border-radius: 999px;
  background: rgba(0,0,0,0.55); color: white; backdrop-filter: blur(4px);
  font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; font-weight: 600;
}
.card .count-badge {
  position: absolute; top: 8px; left: 8px; z-index: 2;
  display: inline-flex; padding: 3px 8px; border-radius: 999px;
  background: rgba(0,0,0,0.62); color: white; backdrop-filter: blur(4px);
  font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; font-weight: 600;
}
.card .corner-flag {
  position: absolute; bottom: 8px; left: 8px; z-index: 2;
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--bad); display: grid; place-items: center;
  box-shadow: 0 1px 4px rgba(0,0,0,0.3);
}
.card .corner-flag .material-icons { font-size: 14px; color: white; }
.card .actions-overlay {
  position: absolute; inset: 0; z-index: 3;
  display: flex; flex-direction: column;
  align-items: flex-end; justify-content: flex-end;
  padding: 6px; gap: 4px;
  opacity: 0; transition: opacity 140ms;
  pointer-events: none;
}
.card:hover .actions-overlay { opacity: 1; }
.card .actions-overlay > * { pointer-events: auto; }
.card .icon-btn {
  width: 28px; height: 28px;
  border-radius: 6px;
  background: rgba(20,15,10,0.78); color: white;
  display: grid; place-items: center;
  backdrop-filter: blur(4px);
  transition: background 120ms;
}
.card .icon-btn:hover { background: rgba(20,15,10,0.92); }
.card .icon-btn .material-icons { font-size: 16px; }
.card .icon-btn.danger:hover { background: var(--bad); }
.card .meta {
  padding: 9px 11px 10px;
  display: flex; flex-direction: column; gap: 2px;
  min-height: 56px;
}
.card .meta .name {
  font-family: 'Spectral', serif;
  font-size: 13.5px; font-weight: 500;
  line-height: 1.25;
  letter-spacing: -0.003em;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden; word-break: break-word;
}
.card .meta .type {
  font-family: 'IBM Plex Mono', monospace; font-size: 9.5px;
  letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--ink-3);
}

/* Compact list view */
.card.compact {
  display: grid; grid-template-columns: 28px 1fr auto auto auto;
  align-items: center; gap: 14px;
  padding: 6px 14px 6px 10px;
  border-radius: 0;
  border: none;
  background: transparent;
  border-bottom: 1px solid var(--rule-2);
  box-shadow: none;
}
.card.compact:hover { transform: none; background: color-mix(in oklch, var(--ink) 4%, transparent); }
.card.compact .meta { padding: 0; min-height: 0; flex-direction: row; gap: 12px; align-items: baseline; }
.card.compact .meta .name { -webkit-line-clamp: 1; font-size: 14px; }
.card.compact .meta .type { width: 110px; flex-shrink: 0; }
.card.compact .corner-cost { position: static; background: transparent; backdrop-filter: none; color: var(--ink-2); padding: 0; }
.card.compact .corner-flag { position: static; width: 14px; height: 14px; }
.card.compact .count-badge { position: static; background: transparent; backdrop-filter: none; color: var(--ink-2); padding: 0; font-weight: 500; }
.card.compact .colors { display: inline-flex; gap: 3px; }
.card.compact .col-dot { width: 10px; height: 10px; border-radius: 50%; }
.card.compact .actions-overlay {
  position: static; flex-direction: row; align-items: center; padding: 0;
  opacity: 1; transition: none;
}
.card.compact .icon-btn { width: 24px; height: 24px; background: transparent; color: var(--ink-3); }
.card.compact .icon-btn:hover { background: color-mix(in oklch, var(--ink) 10%, transparent); color: var(--ink); }
.card.compact .icon-btn.danger:hover { background: color-mix(in oklch, var(--bad) 20%, transparent); color: var(--bad); }
.card.compact .icon-btn .material-icons { font-size: 14px; }

.col-dot.W { background: linear-gradient(135deg, #f0e8c8, #d4c69a); border:1px solid rgba(0,0,0,0.1); }
.col-dot.U { background: linear-gradient(135deg, #7cb8e2, #3a7fb5); }
.col-dot.B { background: linear-gradient(135deg, #4a4a4a, #1a1a1a); }
.col-dot.R { background: linear-gradient(135deg, #e07a6a, #b04a3a); }
.col-dot.G { background: linear-gradient(135deg, #6dbe7c, #3a7d4a); }
.col-dot.C { background: linear-gradient(135deg, #d8d2c5, #a8a294); }

/* ─── Stats rail ─── */
.rail-section { margin-bottom: 24px; }
.rail-section h3 {
  font-family: 'IBM Plex Mono', monospace; font-size: 10.5px;
  letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-3);
  margin: 0 0 10px; font-weight: 500;
}
.rail-section .big-num {
  font-family: 'Spectral', serif; font-size: 32px; font-weight: 400;
  letter-spacing: -0.02em; color: var(--ink); line-height: 1;
}
.snapshot-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
.snapshot-grid > div .eyebrow { margin-top: 2px; }
.validation { display: flex; flex-direction: column; gap: 8px; }
.v-row {
  display: grid; grid-template-columns: 18px 1fr; gap: 10px;
  align-items: start; padding: 8px 12px;
  border-radius: 8px;
  background: var(--surface);
  border: 1px solid var(--rule);
}
.v-row.ok { color: var(--ink-2); }
.v-row.warn { background: color-mix(in oklch, var(--warn) 14%, var(--surface)); border-color: color-mix(in oklch, var(--warn) 30%, var(--rule)); }
.v-row.bad { background: color-mix(in oklch, var(--bad) 12%, var(--surface)); border-color: color-mix(in oklch, var(--bad) 28%, var(--rule)); }
.v-row .material-icons { font-size: 16px; line-height: 1.2; }
.v-row.ok .material-icons { color: var(--good); }
.v-row.warn .material-icons { color: var(--warn); }
.v-row.bad .material-icons { color: var(--bad); }
.v-row .msg { font-size: 12.5px; }
.v-row .det { font-size: 11px; color: var(--ink-3); margin-top: 2px; }

/* Mana curve */
.curve { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; align-items: end; height: 80px; }
.curve .bar {
  background: linear-gradient(180deg, var(--accent), color-mix(in oklch, var(--accent) 60%, var(--bg)));
  border-radius: 3px 3px 0 0;
  position: relative;
  min-height: 2px;
}
.curve .bar::after {
  content: attr(data-n);
  position: absolute; top: -16px; left: 50%; transform: translateX(-50%);
  font-family: 'IBM Plex Mono', monospace; font-size: 9px; color: var(--ink-3);
}
.curve-labels { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; margin-top: 4px; }
.curve-labels span { text-align: center; font-family: 'IBM Plex Mono', monospace; font-size: 9px; color: var(--ink-3); }

/* Type breakdown */
.types { display: flex; flex-direction: column; gap: 6px; }
.t-row {
  display: grid; grid-template-columns: 1fr 1fr 30px; gap: 10px;
  align-items: center; padding: 2px 0; font-size: 12.5px;
}
.t-bar-bg { height: 6px; background: var(--rule-2); border-radius: 999px; overflow: hidden; }
.t-bar-bg > div { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-3)); border-radius: 999px; }
.t-row .n { font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: var(--ink-2); text-align: right; }

/* Color distribution */
.cd { display: flex; flex-direction: column; gap: 6px; }
.cd-row { display: grid; grid-template-columns: 22px 1fr 36px; gap: 10px; align-items: center; }
.cd-bar { height: 10px; background: var(--rule-2); border-radius: 999px; overflow: hidden; }
.cd-bar > div { height: 100%; border-radius: 999px; }
.cd-pct { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-3); text-align: right; }
.cd-row .cd-bar > div.W { background: linear-gradient(90deg, #d4c69a, #f0e8c8); }
.cd-row .cd-bar > div.U { background: linear-gradient(90deg, #3a7fb5, #7cb8e2); }
.cd-row .cd-bar > div.B { background: linear-gradient(90deg, #1a1a1a, #4a4a4a); }
.cd-row .cd-bar > div.R { background: linear-gradient(90deg, #b04a3a, #e07a6a); }
.cd-row .cd-bar > div.G { background: linear-gradient(90deg, #3a7d4a, #6dbe7c); }
.cd-row .cd-bar > div.C { background: linear-gradient(90deg, #a8a294, #d8d2c5); }
.cd-row .cd-bar > div.M { background: linear-gradient(90deg, var(--accent), var(--accent-3)); }

.land-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px 0; margin-top: 6px;
  border-top: 1px solid var(--rule-2);
  font-size: 12.5px;
}
.land-row .ind {
  font-family: 'IBM Plex Mono', monospace; font-size: 10px;
  letter-spacing: 0.1em; text-transform: uppercase;
  padding: 2px 6px; border-radius: 4px;
  margin-left: 8px;
}
.land-row .ind.ok   { color: var(--good); background: color-mix(in oklch, var(--good) 14%, transparent); }
.land-row .ind.low  { color: var(--warn); background: color-mix(in oklch, var(--warn) 14%, transparent); }
.land-row .ind.high { color: var(--bad);  background: color-mix(in oklch, var(--bad) 14%, transparent); }

/* ─── Modals ─── */
.modal-backdrop {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(15, 10, 5, 0.5); backdrop-filter: blur(6px);
  display: grid; place-items: center;
  padding: 40px;
  animation: fade 200ms;
}
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes pop { from { opacity: 0; transform: translateY(8px) scale(0.985); } to { opacity: 1; transform: none; } }
.modal {
  background: var(--bg);
  border-radius: 16px;
  box-shadow: var(--shadow-lg);
  border: 1px solid var(--rule);
  max-width: 100%; max-height: 100%;
  overflow: hidden;
  animation: pop 220ms cubic-bezier(.2,.6,.2,1);
  display: flex; flex-direction: column;
}
.modal-shell { display: contents; }
.modal-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 24px;
  border-bottom: 1px solid var(--rule);
  flex-shrink: 0;
}
.modal-head h2 { font-family: 'Spectral', serif; font-size: 22px; font-weight: 500; margin: 0; letter-spacing: -0.01em; }
.modal-close { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; color: var(--ink-2); }
.modal-close:hover { background: color-mix(in oklch, var(--ink) 7%, transparent); color: var(--ink); }
.modal-body { padding: 22px 24px; overflow-y: auto; flex: 1 1 auto; min-height: 0; }
.modal-foot {
  display: flex; justify-content: flex-end; gap: 10px;
  padding: 14px 24px;
  border-top: 1px solid var(--rule);
  background: var(--surface);
  flex-shrink: 0;
}

/* Form helpers */
.input {
  width: 100%; padding: 9px 12px;
  border: 1px solid var(--rule); border-radius: 8px;
  background: var(--bg); color: var(--ink);
  font-size: 13px;
}
.input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
.dropzone {
  border: 1.5px dashed var(--rule); border-radius: 10px;
  padding: 28px; text-align: center; color: var(--ink-3);
  background: var(--surface-2);
  transition: all 120ms;
  cursor: pointer;
}
.dropzone:hover, .dropzone.dragover { border-color: var(--accent); color: var(--ink-2); background: color-mix(in oklch, var(--accent) 6%, var(--surface-2)); }

/* Import modal */
.import-grid { display: grid; gap: 18px; }
.import-card {
  border: 1px solid var(--rule); border-radius: 12px;
  background: var(--surface);
  padding: 18px;
}
.import-card h3 { font-family: 'Spectral', serif; font-size: 16px; font-weight: 500; margin: 0 0 8px; }
.import-card p { color: var(--ink-2); font-size: 12.5px; margin: 0 0 14px; }

/* Export modal */
.export-summary { display: grid; gap: 14px; }
.kv {
  display: grid; grid-template-columns: 110px 1fr;
  gap: 14px; align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid var(--rule-2);
}
.kv .k { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); }
.kv .v { font-size: 13px; }
.card-back-row {
  display: grid; grid-template-columns: 64px 1fr; gap: 14px; align-items: center;
}
.card-back-thumb {
  aspect-ratio: 2.5/3.5; border-radius: 6px;
  background: var(--surface-2); border: 1px solid var(--rule);
  overflow: hidden;
}
.card-back-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

/* Alt art picker */
.alt-modal { width: min(1100px, 100%); height: min(760px, 100%); }
.alt-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  height: 100%; min-height: 0;
}
.alt-preview {
  background: var(--bg-mat);
  padding: 28px;
  display: flex; flex-direction: column; gap: 16px;
  border-right: 1px solid var(--rule);
  min-height: 0;
}
.alt-preview .pcard {
  flex: 1; min-height: 0;
  border-radius: 14px;
  box-shadow: var(--shadow-lg);
  overflow: hidden;
  background: var(--surface-2);
  display: grid; place-items: center;
}
.alt-preview .pcard img { width: 100%; height: 100%; object-fit: contain; display: block; }
.alt-meta { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.alt-meta .name { font-family: 'Spectral', serif; font-size: 22px; font-weight: 500; margin: 0; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.alt-meta .copies {
  display: flex; align-items: center; gap: 4px;
  background: var(--surface); border: 1px solid var(--rule);
  border-radius: 999px; padding: 2px;
  flex-shrink: 0;
}
.alt-meta .copies button { padding: 4px 8px; border-radius: 999px; color: var(--ink-2); }
.alt-meta .copies button:hover { color: var(--ink); }
.alt-meta .copies .count { font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; padding: 0 8px; color: var(--ink); }

.alt-list { padding: 22px; overflow-y: auto; min-height: 0; display: flex; flex-direction: column; }
.alt-list-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; gap: 12px; flex-shrink: 0; }
.alt-list-search { display: flex; gap: 8px; margin-bottom: 14px; flex-shrink: 0; }
.alt-list-search input { flex: 1; }
.alt-thumbs {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  gap: 10px;
  overflow-y: auto;
  flex: 1; min-height: 0;
  padding-right: 4px;
}
.alt-thumb {
  aspect-ratio: 2.5/3.5; border-radius: 8px;
  position: relative; cursor: pointer;
  border: 2px solid transparent;
  box-shadow: var(--shadow-sm);
  overflow: hidden;
  background: var(--surface-2);
}
.alt-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.alt-thumb:hover { transform: translateY(-2px); }
.alt-thumb.active { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in oklch, var(--accent) 30%, transparent); }
.alt-thumb .tag {
  position: absolute; left: 6px; bottom: 6px;
  padding: 2px 6px; border-radius: 4px;
  background: rgba(0,0,0,0.7); color: white;
  font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 0.06em;
  max-width: calc(100% - 12px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.alt-thumb .fav-btn {
  position: absolute; top: 6px; right: 6px;
  width: 24px; height: 24px;
  border-radius: 50%;
  background: rgba(0,0,0,0.5); color: white;
  display: grid; place-items: center;
  backdrop-filter: blur(4px);
  opacity: 0; transition: opacity 140ms;
}
.alt-thumb:hover .fav-btn { opacity: 1; }
.alt-thumb .fav-btn.on { opacity: 1; color: #f4c542; }
.alt-thumb .fav-btn .material-icons { font-size: 14px; }
.alt-thumb.fav .fav-btn { opacity: 1; }
.alt-thumb .rm-btn {
  position: absolute; top: 6px; left: 6px;
  width: 24px; height: 24px;
  border-radius: 50%;
  background: rgba(0,0,0,0.5); color: white;
  display: grid; place-items: center;
  backdrop-filter: blur(4px);
  opacity: 0; transition: opacity 140ms;
}
.alt-thumb:hover .rm-btn { opacity: 1; }
.alt-thumb .rm-btn:hover { background: var(--bad); }
.alt-thumb .rm-btn .material-icons { font-size: 14px; }

/* Settings modal */
.settings-modal { width: min(900px, 100%); height: min(700px, 100%); }
.settings-grid { display: grid; grid-template-columns: 180px 1fr; height: 100%; min-height: 0; }
.settings-nav { background: var(--surface); border-right: 1px solid var(--rule); padding: 18px 12px; display: flex; flex-direction: column; gap: 2px; }
.settings-nav button {
  text-align: left; padding: 9px 14px; border-radius: 7px;
  font-size: 13.5px; color: var(--ink-2);
}
.settings-nav button:hover { background: color-mix(in oklch, var(--ink) 5%, transparent); }
.settings-nav button.on { background: color-mix(in oklch, var(--accent) 18%, transparent); color: var(--ink); font-weight: 500; }
.settings-pane { overflow-y: auto; padding: 24px 28px; }
.settings-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 0; border-bottom: 1px solid var(--rule-2);
  gap: 24px;
}
.settings-row:last-child { border-bottom: none; }
.settings-row .lbl { font-weight: 500; font-size: 13.5px; }
.settings-row .desc { color: var(--ink-3); font-size: 12px; margin-top: 2px; max-width: 360px; }

/* Theme wheel */
.theme-wheel-wrap { padding: 22px 0 12px; display: grid; grid-template-columns: 280px 1fr; gap: 30px; align-items: start; }
.theme-wheel { width: 280px; height: 280px; position: relative; }
.theme-wheel svg { width: 100%; height: 100%; overflow: visible; }
.theme-wheel circle.color-node { cursor: pointer; transition: all 160ms; }
.theme-wheel circle.color-node:hover { filter: brightness(1.06); }
.theme-wheel circle.color-node.on { stroke: var(--ink); stroke-width: 3; }
.theme-list h4 { font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); margin: 12px 0 6px; font-weight: 500; }
.theme-list h4:first-child { margin-top: 0; }
.theme-row { display: flex; flex-wrap: wrap; gap: 6px; }
.theme-chip {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 5px 11px 5px 5px;
  border-radius: 999px;
  background: var(--surface); border: 1px solid var(--rule);
  font-size: 12px;
  cursor: pointer;
  transition: all 120ms;
  color: var(--ink);
}
.theme-chip:hover { border-color: color-mix(in oklch, var(--ink) 25%, transparent); }
.theme-chip.on { background: color-mix(in oklch, var(--accent) 14%, var(--surface)); border-color: var(--accent); }
.theme-chip .sw { display: inline-flex; height: 20px; border-radius: 999px; overflow: hidden; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.1); }
.theme-chip .sw i { display: block; width: 8px; height: 100%; }

/* Toggle */
.toggle { width: 38px; height: 22px; border-radius: 999px; background: var(--rule); position: relative; transition: background 160ms; cursor: pointer; flex-shrink: 0; }
.toggle::after { content: ''; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: white; box-shadow: var(--shadow-sm); transition: transform 180ms cubic-bezier(.2,.7,.2,1); }
.toggle.on { background: var(--accent); }
.toggle.on::after { transform: translateX(16px); }

/* Search modal */
.search-modal { width: min(720px, 100%); max-height: min(680px, 100%); }
.search-results { display: flex; flex-direction: column; gap: 2px; margin-top: 12px; max-height: 460px; overflow-y: auto; }
.search-result-row {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 12px;
  border-radius: 8px;
  cursor: pointer;
  transition: background 100ms;
  border: 1px solid transparent;
}
.search-result-row:hover { background: color-mix(in oklch, var(--ink) 5%, transparent); border-color: var(--rule); }
.search-result-row .info { flex: 1; min-width: 0; }
.search-result-row .nm { font-family: 'Spectral', serif; font-size: 14.5px; font-weight: 500; line-height: 1.2; }
.search-result-row .tp { font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); margin-top: 2px; }
.search-result-row .cmc {
  display: inline-flex; padding: 3px 8px; border-radius: 999px;
  background: var(--surface-2); border: 1px solid var(--rule);
  font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-2);
  flex-shrink: 0;
}

/* Library / decks modal */
.lib-list { display: flex; flex-direction: column; gap: 6px; }
.lib-row {
  display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 14px;
  align-items: center;
  padding: 12px 16px;
  border: 1px solid var(--rule);
  background: var(--surface);
  border-radius: 10px;
}
.lib-row > div:nth-child(2) { min-width: 0; }
.lib-row.active { border-color: var(--accent); background: color-mix(in oklch, var(--accent) 10%, var(--surface)); }
.lib-pip { width: 12px; height: 12px; border-radius: 50%; }
.lib-name { font-family: 'Spectral', serif; font-size: 16px; font-weight: 500; letter-spacing: -0.005em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lib-sub { font-size: 12px; color: var(--ink-3); margin-top: 2px; display: flex; align-items: center; gap: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lib-sub > * { flex-shrink: 0; }
.lib-sub > span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; flex-shrink: 1; }
.lib-actions { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
.lib-actions .btn { padding: 6px 10px; font-size: 12px; white-space: nowrap; }
.lib-actions .btn.icon { padding: 6px; width: 30px; }

/* Generic confirm */
.confirm-list {
  text-align: left;
  max-height: 240px; overflow-y: auto;
  margin: 8px 0;
  background: var(--surface); border: 1px solid var(--rule);
  border-radius: 8px;
  padding: 8px 12px;
}
.confirm-list .issue {
  display: flex; align-items: flex-start; gap: 8px;
  padding: 6px 0;
  font-size: 12.5px;
}
.confirm-list .issue + .issue { border-top: 1px solid var(--rule-2); }
.confirm-list .issue .material-icons { font-size: 16px; flex-shrink: 0; margin-top: 1px; }
.confirm-list .issue.error .material-icons { color: var(--bad); }
.confirm-list .issue.warning .material-icons { color: var(--warn); }
.confirm-list .issue .det { font-size: 11px; color: var(--ink-3); margin-top: 2px; }

/* Misc */
.empty {
  display: grid; place-items: center; padding: 40px;
  color: var(--ink-3); text-align: center;
  font-family: 'Spectral', serif; font-style: italic; font-size: 14px;
}
.loading-row {
  display: grid; place-items: center; padding: 24px;
  color: var(--ink-3); font-size: 13px;
}
.loading-row::before {
  content: '';
  width: 22px; height: 22px;
  border: 2px solid var(--rule);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-bottom: 8px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Card hover preview */
.card-preview {
  position: fixed; pointer-events: none;
  z-index: 1000;
  width: 280px;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: var(--shadow-lg);
  opacity: 0;
  transition: opacity 140ms;
  display: none;
}
.card-preview.show { opacity: 1; }
.card-preview img { width: 100%; display: block; }

/* Loading overlay */
.loading-overlay {
  position: fixed; inset: 0; z-index: 400;
  background: rgba(15, 10, 5, 0.62); backdrop-filter: blur(8px);
  display: none; place-items: center;
  animation: fade 200ms;
}
.loading-overlay.active { display: grid; }
.loading-content {
  background: var(--bg);
  border: 1px solid var(--rule);
  border-radius: 16px;
  padding: 32px 40px;
  text-align: center;
  box-shadow: var(--shadow-lg);
  min-width: 360px;
}
.loading-spinner {
  width: 44px; height: 44px;
  border: 3px solid var(--rule);
  border-top-color: var(--accent);
  border-radius: 50%;
  margin: 0 auto 16px;
  animation: spin 0.8s linear infinite;
}
.loading-title {
  font-family: 'Spectral', serif; font-size: 18px; font-weight: 500;
  margin-bottom: 4px;
}
.loading-message { color: var(--ink-3); font-size: 12.5px; margin-bottom: 14px; }
.loading-progress { background: var(--surface-2); border-radius: 999px; height: 6px; overflow: hidden; }
.loading-progress-bar {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--accent), var(--accent-3));
  transition: width 180ms;
  border-radius: 999px;
}
.loading-progress-text { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-3); margin-top: 6px; }

/* Notifications */
.notif-stack { position: fixed; bottom: 24px; right: 24px; z-index: 500; display: flex; flex-direction: column; gap: 8px; max-width: 360px; }
.notif {
  background: var(--surface); border: 1px solid var(--rule);
  border-left: 3px solid var(--accent);
  border-radius: 8px; padding: 10px 14px;
  box-shadow: var(--shadow-md);
  font-size: 13px;
  display: flex; align-items: flex-start; gap: 10px;
  animation: pop 200ms;
}
.notif.success { border-left-color: var(--good); }
.notif.error { border-left-color: var(--bad); }
.notif.warning { border-left-color: var(--warn); }
.notif .icon-wrap { flex-shrink: 0; padding-top: 1px; }
.notif .icon-wrap .material-icons { font-size: 18px; }
.notif.success .icon-wrap .material-icons { color: var(--good); }
.notif.error .icon-wrap .material-icons { color: var(--bad); }
.notif.warning .icon-wrap .material-icons { color: var(--warn); }
.notif .nm-body { flex: 1; min-width: 0; }
.notif .nm-title { font-weight: 500; font-size: 12.5px; }
.notif .nm-msg { color: var(--ink-2); font-size: 12px; margin-top: 1px; word-wrap: break-word; }
.notif .nm-close {
  color: var(--ink-3); width: 18px; height: 18px;
  display: grid; place-items: center; border-radius: 4px;
  flex-shrink: 0;
}
.notif .nm-close:hover { background: color-mix(in oklch, var(--ink) 10%, transparent); color: var(--ink); }

.modal-backdrop.hidden { display: none; }

  'glint-eye':['U','B','R','G'], 'dune-brood':['B','R','G','W'], 'ink-treader':['R','G','W','U'],

// ─────────────────────────────────────────────────────────────────────────
// Tiny DOM helpers
// ─────────────────────────────────────────────────────────────────────────
function $(id) { return document.getElementById(id); }
function el(tag, attrs = {}, children = []) {
  const n = document.createElement(tag);
  for (const k in attrs) {
    if (k === 'class') n.className = attrs[k];
    else if (k === 'style' && typeof attrs[k] === 'object') Object.assign(n.style, attrs[k]);
    else if (k.startsWith('on') && typeof attrs[k] === 'function') n.addEventListener(k.slice(2).toLowerCase(), attrs[k]);
    else if (k === 'html') n.innerHTML = attrs[k];
    else if (k === 'dataset') Object.assign(n.dataset, attrs[k]);
    else if (attrs[k] !== undefined && attrs[k] !== null && attrs[k] !== false) n.setAttribute(k, attrs[k]);
  }
  (Array.isArray(children) ? children : [children]).forEach(c => {
    if (c == null || c === false) return;
    if (typeof c === 'string' || typeof c === 'number') n.appendChild(document.createTextNode(String(c)));
    else n.appendChild(c);
  });
  return n;
}
function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function icon(name, sz) {
  const i = el('span', { class: 'material-icons' });
  i.textContent = name;
  if (sz) i.style.fontSize = sz + 'px';
  return i;
}

// ─────────────────────────────────────────────────────────────────────────
// localStorage persistence
// ─────────────────────────────────────────────────────────────────────────
const MAX_OPEN_TABS = 10;

function loadDecks() {
  const saved = localStorage.getItem('commander2tts_decks');
  if (saved) {
    try {
      STATE.decks = JSON.parse(saved);
      STATE.decks.forEach(deck => {
        if (!deck.cardBackUrl) deck.cardBackUrl = DEFAULT_CARD_BACK;
        // Legacy migration: single commander → commanders array
        if (deck.commander !== undefined && !deck.commanders) {
          deck.commanders = deck.commander ? [deck.commander] : [];
          delete deck.commander;
        }
        if (!deck.commanders) deck.commanders = [];
        if (!deck.cards) deck.cards = [];
        if (!deck.tokens) deck.tokens = [];
        // Open-in-tab flag: default true for backwards compat
        if (deck.open === undefined) deck.open = true;
      });
      // Cap open tabs to MAX_OPEN_TABS — keep the first N open if more were somehow saved
      const openIndices = STATE.decks.map((d, i) => d.open ? i : -1).filter(i => i >= 0);
      if (openIndices.length > MAX_OPEN_TABS) {
        openIndices.slice(MAX_OPEN_TABS).forEach(i => { STATE.decks[i].open = false; });
      }
      // Ensure at least one open tab if any decks exist
      if (STATE.decks.length > 0 && !STATE.decks.some(d => d.open)) {
        STATE.decks[0].open = true;
      }
    } catch {
      STATE.decks = [];
    }
  }
  if (STATE.decks.length === 0) {
    STATE.decks.push(createNewDeck());
  }
  // currentDeckIndex must point at an open deck
  if (!STATE.decks[STATE.currentDeckIndex] || !STATE.decks[STATE.currentDeckIndex].open) {
    const firstOpen = STATE.decks.findIndex(d => d.open);
    STATE.currentDeckIndex = firstOpen >= 0 ? firstOpen : 0;
  }
}
function saveDecks() {
  localStorage.setItem('commander2tts_decks', JSON.stringify(STATE.decks));
}
function createNewDeck() {
  return {
    name: `Deck ${STATE.decks.length + 1}`,
    commanders: [],
    cards: [],
    tokens: [],
    cardBackUrl: DEFAULT_CARD_BACK,
    open: true,
  };
}
function getCurrentDeck() {
  return STATE.decks[STATE.currentDeckIndex];
}
function isDeckEmpty(deck) {
  return deck.cards.length === 0 &&
         (!deck.commanders || deck.commanders.length === 0) &&
         (!deck.tokens || deck.tokens.length === 0);
}

// Tab management
function getOpenCount() { return STATE.decks.filter(d => d.open).length; }

// Opens a deck (sets open=true and makes it active). If at cap, returns false and shows a notice.
function openDeckInTab(idx, makeActive = true) {
  const deck = STATE.decks[idx];
  if (!deck) return false;
  if (!deck.open) {
    if (getOpenCount() >= MAX_OPEN_TABS) {
      showNotification(`You can have at most ${MAX_OPEN_TABS} decks open at once. Close one first.`, 'warning', 'Tab limit');
      return false;
    }
    deck.open = true;
  }
  if (makeActive) STATE.currentDeckIndex = idx;
  saveDecks();
  return true;
}

// Closes a deck (sets open=false). If it was the active tab, switches to the previous/next open tab.
function closeDeckTab(idx) {
  const deck = STATE.decks[idx];
  if (!deck || !deck.open) return;
  deck.open = false;
  // If we just closed the active tab, pick a new active
  if (STATE.currentDeckIndex === idx) {
    const openIndices = STATE.decks.map((d, i) => d.open ? i : -1).filter(i => i >= 0);
    if (openIndices.length === 0) {
      // No open tabs left — auto-open the deck we just closed back, or create new
      deck.open = true;
      return; // refuse to close the last tab
    }
    // Pick the closest still-open tab (prefer previous)
    let next = openIndices.filter(i => i < idx).pop();
    if (next === undefined) next = openIndices[0];
    STATE.currentDeckIndex = next;
  }
  saveDecks();
}

// Alt art favorites and custom art storage
function getAltArtFavorites() {
  try { return JSON.parse(localStorage.getItem('commander2tts_favorites') || '{}'); }
  catch { return {}; }
}
function saveAltArtFavorites(fav) { localStorage.setItem('commander2tts_favorites', JSON.stringify(fav)); }
function isArtFavorited(name, url) { return (getAltArtFavorites()[name] || []).includes(url); }
function toggleArtFavorite(name, url) {
  const f = getAltArtFavorites();
  if (!f[name]) f[name] = [];
  const i = f[name].indexOf(url);
  if (i >= 0) { f[name].splice(i, 1); if (!f[name].length) delete f[name]; }
  else f[name].push(url);
  saveAltArtFavorites(f);
}
function getCustomArt(name) {
  try {
    const all = JSON.parse(localStorage.getItem('commander2tts_custom_art') || '{}');
    return all[name] || [];
  } catch { return []; }
}
function addCustomArt(name, url) {
  try {
    const all = JSON.parse(localStorage.getItem('commander2tts_custom_art') || '{}');
    if (!all[name]) all[name] = [];
    if (!all[name].includes(url)) {
      all[name].push(url);
      localStorage.setItem('commander2tts_custom_art', JSON.stringify(all));
    }
  } catch {}
}
function removeCustomArt(name, url) {
  try {
    const all = JSON.parse(localStorage.getItem('commander2tts_custom_art') || '{}');
    if (all[name]) {
      all[name] = all[name].filter(u => u !== url);
      if (!all[name].length) delete all[name];
      localStorage.setItem('commander2tts_custom_art', JSON.stringify(all));
    }
    const f = getAltArtFavorites();
    if (f[name]) {
      f[name] = f[name].filter(u => u !== url);
      if (!f[name].length) delete f[name];
      saveAltArtFavorites(f);
    }
  } catch {}
}

function isValidUrl(s) { try { const u = new URL(s); return u.protocol === 'http:' || u.protocol === 'https:'; } catch { return false; } }
function isValidImageUrl(url) {
  return new Promise(resolve => {
    if (!isValidUrl(url)) { resolve(false); return; }
    const img = new Image();
    img.onload = () => resolve(true);
    img.onerror = () => resolve(false);
    img.src = url;
  });
}
function isScryfallUrl(url) { return url && (url.includes('scryfall.io') || url.includes('scryfall.com')); }

// ─────────────────────────────────────────────────────────────────────────
// Scryfall API
// ─────────────────────────────────────────────────────────────────────────
async function scryfallFetchWithRetry(url, options = {}, maxRetries = 3) {
  let lastResponse;
  for (let attempt = 0; attempt <= maxRetries; attempt++) {
    lastResponse = await fetch(url, options);
    if (lastResponse.status === 503) {
      const err = new Error('Ooopsie, seems like Scryfall is having issues :/');
      err.isScryfallDown = true;
      throw err;
    }
    if (lastResponse.status !== 429) return lastResponse;
    if (attempt < maxRetries) {
      const delay = Math.pow(2, attempt) * 1000;
      console.warn(`Scryfall rate limit (429), retrying in ${delay}ms (attempt ${attempt + 1}/${maxRetries})…`);
      await new Promise(r => setTimeout(r, delay));
    }
  }
  return lastResponse;
}

async function fetchCardsByNameBatch(names) {
  const cardMap = new Map();
  const uniqueNames = [...new Set(names.filter(n => n && typeof n === 'string' && n.trim()))];
  for (let i = 0; i < uniqueNames.length; i += 75) {
    const batch = uniqueNames.slice(i, i + 75);
    await new Promise(r => setTimeout(r, 100));
    try {
      const resp = await scryfallFetchWithRetry(
        'https://api.scryfall.com/cards/collection',
        {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identifiers: batch.map(name => ({ name: name.trim() })) })
        }
      );
      if (resp.ok) {
        const data = await resp.json();
        (data.data || []).forEach(c => cardMap.set(c.name.toLowerCase(), c));
      }
    } catch (e) {
      if (e.isScryfallDown) throw e;
      console.warn('Batch fetch failed:', e);
    }
  }
  return cardMap;
}

async function fetchCardByName(name) {
  if (!name || typeof name !== 'string' || !name.trim()) return null;
  try {
    await new Promise(r => setTimeout(r, 100));
    const resp = await scryfallFetchWithRetry(
      `https://api.scryfall.com/cards/named?exact=${encodeURIComponent(name.trim())}`
    );
    if (!resp.ok) return null;
    return await resp.json();
  } catch (e) {
    if (e.isScryfallDown) throw e;
    console.error(`Error fetching "${name}":`, e);
    return null;
  }
}

async function autoDetectTokens(deck, scryfallCards) {
  const tokenIds = new Map();
  for (const card of scryfallCards) {
    if (!card || !card.all_parts) continue;
    for (const part of card.all_parts) {
      if (part.component === 'token' && part.id && !tokenIds.has(part.id)) {
        tokenIds.set(part.id, part);
      }
    }
  }
  if (tokenIds.size === 0) return;

  const allTokenCards = [];
  const ids = [...tokenIds.keys()];
  for (let i = 0; i < ids.length; i += 75) {
    const batch = ids.slice(i, i + 75);
    await new Promise(r => setTimeout(r, 100));
    try {
      const resp = await scryfallFetchWithRetry(
        'https://api.scryfall.com/cards/collection',
        {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identifiers: batch.map(id => ({ id })) })
        }
      );
      if (resp.ok) {
        const data = await resp.json();
        if (data.data) allTokenCards.push(...data.data);
      }
    } catch (e) {
      if (e.isScryfallDown) throw e;
      console.warn('Token batch fetch failed:', e);
    }
  }
  for (const tk of allTokenCards) {
    let imageUrl = tk.image_uris?.normal;
    let colors = tk.colors || [];
    if (!imageUrl && tk.card_faces) {
      const tokenFace = tk.card_faces.find(f => f.type_line && f.type_line.includes('Token')) || tk.card_faces[0];
      imageUrl = tokenFace?.image_uris?.normal;
      colors = tokenFace?.colors || colors;
    }
    if (!imageUrl) continue;
    const sortedColors = [...colors].sort().join('');
    const exists = deck.tokens.some(t =>
      t.name === tk.name && [...(t.colors || [])].sort().join('') === sortedColors
    );
    if (exists) continue;
    deck.tokens.push({
      id: tk.id,
      name: tk.name,
      type_line: tk.type_line,
      image_url: imageUrl,
      scryfall_uri: tk.scryfall_uri,
      cmc: tk.cmc || 0,
      colors,
    });
  }
}

// ─────────────────────────────────────────────────────────────────────────
// Commander rules
// ─────────────────────────────────────────────────────────────────────────
function canBeCommander(card) {
  const legal = card.legalities && (card.legalities.commander === 'legal' || card.legalities.commander === 'restricted');
  const isLegendaryCreature = card.type_line && card.type_line.includes('Legendary') && card.type_line.includes('Creature');
  const isLegendaryPW = card.type_line && card.type_line.includes('Legendary') && card.type_line.includes('Planeswalker');
  const oracleAllows = card.type_line && card.type_line.includes('Background');
  if (card.legalities && Object.keys(card.legalities).length > 0) {
    return legal && (isLegendaryCreature || isLegendaryPW || oracleAllows);
  }
  return isLegendaryCreature || isLegendaryPW;
}
function hasPartner(card) {
  const kw = card.keywords || [];
  return kw.some(k =>
    k === 'Partner' || k.startsWith('Partner with') ||
    k === 'Friends forever' || k === 'Choose a Background' ||
    k === 'Background' || k === "Doctor's companion"
  );
}
function partnersCompatible(a, b) {
  const kwA = a.keywords || [];
  const kwB = b.keywords || [];
  if (kwA.includes('Partner') && kwB.includes('Partner')) return true;
  const partnerWithA = kwA.find(k => k.startsWith('Partner with '));
  const partnerWithB = kwB.find(k => k.startsWith('Partner with '));
  if (partnerWithA && partnerWithA === `Partner with ${b.name}`) return true;
  if (partnerWithB && partnerWithB === `Partner with ${a.name}`) return true;
  if (kwA.includes('Friends forever') && kwB.includes('Friends forever')) return true;
  if (kwA.includes('Choose a Background') && kwB.includes('Background')) return true;
  if (kwB.includes('Choose a Background') && kwA.includes('Background')) return true;
  const isDoctor = c => c.type_line && c.type_line.includes('Time Lord') && c.type_line.includes('Doctor');
  if (kwA.includes("Doctor's companion") && isDoctor(b)) return true;
  if (kwB.includes("Doctor's companion") && isDoctor(a)) return true;
  return false;
}

// ─────────────────────────────────────────────────────────────────────────
// Deck validation
// ─────────────────────────────────────────────────────────────────────────
function validateDeck(deck) {
  const issues = [];
  if (!deck.commanders || deck.commanders.length === 0) {
    issues.push({ type: 'error', icon: 'person_off', message: 'No commander selected' });
  }
  const expectedMain = (deck.commanders && deck.commanders.length === 2) ? 98 : 99;
  const mainCount = deck.cards ? deck.cards.length : 0;
  if (mainCount < expectedMain) {
    issues.push({ type: 'warning', icon: 'remove_circle_outline', message: `Deck has ${mainCount} cards (need ${expectedMain})` });
  } else if (mainCount > expectedMain) {
    issues.push({ type: 'error', icon: 'add_circle_outline', message: `Deck has ${mainCount} cards (max ${expectedMain})` });
  }

  // Color identity violations
  if (deck.commanders && deck.commanders.length > 0) {
    const commanderIdentity = new Set();
    let hasIdentityData = false;
    deck.commanders.forEach(cmd => {
      if (cmd.color_identity && cmd.color_identity.length >= 0) {
        hasIdentityData = true;
        cmd.color_identity.forEach(c => commanderIdentity.add(c));
      }
    });
    if (hasIdentityData && deck.cards) {
      const groups = new Map();
      deck.cards.forEach(card => {
        if (!card.color_identity) return;
        const violations = card.color_identity.filter(c => !commanderIdentity.has(c));
        if (violations.length > 0) {
          if (groups.has(card.name)) groups.get(card.name).count++;
          else groups.set(card.name, { count: 1, violations });
        }
      });
      const colorNames = { W: 'White', U: 'Blue', B: 'Black', R: 'Red', G: 'Green' };
      groups.forEach(({ count, violations }, name) => {
        const violationNames = violations.map(v => colorNames[v] || v).join(', ');
        issues.push({
          type: 'error', icon: 'palette',
          message: count > 1 ? `${name} (×${count})` : name,
          detail: `Contains ${violationNames} outside color identity`
        });
      });
    }
  }

  // Banned cards
  if (deck.cards) {
    const banned = new Map();
    deck.cards.forEach(c => {
      if (c.legalities && c.legalities.commander === 'banned') {
        banned.set(c.name, (banned.get(c.name) || 0) + 1);
      }
    });
    banned.forEach((count, name) => {
      issues.push({
        type: 'error', icon: 'block',
        message: count > 1 ? `${name} (×${count})` : name,
        detail: 'Banned in Commander'
      });
    });
  }
  if (deck.commanders) {
    deck.commanders.forEach(cmd => {
      if (cmd.legalities && cmd.legalities.commander === 'banned') {
        issues.push({ type: 'error', icon: 'block', message: cmd.name, detail: 'Banned in Commander' });
      }
    });
  }

  // Duplicate non-basic, non-unlimited cards
  if (deck.cards) {
    const counts = {};
    deck.cards.forEach(c => { counts[c.name] = (counts[c.name] || 0) + 1; });
    Object.entries(counts).forEach(([name, count]) => {
      if (count > 1 && !BASIC_LANDS.includes(name) && !UNLIMITED_CARDS.includes(name)) {
        issues.push({
          type: 'error', icon: 'content_copy',
          message: `${name} (×${count})`,
          detail: 'Duplicate card (singleton format)'
        });
      }
    });
  }
  return issues;
}

// ─────────────────────────────────────────────────────────────────────────
// Theme management
// ─────────────────────────────────────────────────────────────────────────
function isMatchCommanderColors() { return localStorage.getItem('commander2tts_themeMatchCI') === 'true'; }
function getThemeForDeck(deck) {
  if (!deck || !Array.isArray(deck.commanders) || deck.commanders.length === 0) return 'purple';
  const identity = new Set();
  deck.commanders.forEach(cmd => {
    if (Array.isArray(cmd.color_identity)) {
      cmd.color_identity.forEach(c => { if (c in WUBRG_ORDER) identity.add(c); });
    }
  });
  const sorted = Array.from(identity).sort((a,b) => WUBRG_ORDER[a] - WUBRG_ORDER[b]);
  return COLOR_IDENTITY_THEMES[sorted.join(',')] || 'purple';
}
function applyTheme() {
  const isDark = localStorage.getItem('theme') === 'dark';
  document.body.setAttribute('data-theme', isDark ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
  let color;
  if (isMatchCommanderColors()) {
    color = getThemeForDeck(getCurrentDeck());
  } else {
    color = localStorage.getItem('themeColor') || 'purple';
  }
  document.body.setAttribute('data-color', color);
  document.documentElement.setAttribute('data-color', color);
}
function toggleDarkMode(val) {
  localStorage.setItem('theme', val ? 'dark' : 'light');
  applyTheme();
}
function setColorTheme(color) {
  localStorage.setItem('themeColor', color);
  localStorage.setItem('commander2tts_themeMatchCI', 'false');

}

}

// ─────────────────────────────────────────────────────────────────────────
// Card grouping & sorting
// ─────────────────────────────────────────────────────────────────────────
function groupCardsByName(cards) {
  const grouped = {};
  cards.forEach((card, index) => {
    const colorKey = (card.colors || []).sort().join('');
    const key = `${card.name}|${colorKey}`;
    if (!grouped[key]) grouped[key] = { card, count: 0, ids: [], indices: [] };
    grouped[key].count++;
    grouped[key].ids.push(card.id);
    grouped[key].indices.push(card._deckIndex !== undefined ? card._deckIndex : index);
  });
  return Object.values(grouped);
}
function getColorOrder(card) {
  if (!card.colors || card.colors.length === 0) return 5;
  if (card.colors.length === 1) return WUBRG_ORDER[card.colors[0]] ?? 5;
  for (const c of ['W','U','B','R','G']) {
    if (card.colors.includes(c)) return WUBRG_ORDER[c];
  }
  return 5;
}
function sortCards(groups, sortBy, sortOrder) {
  const TYPE_ORDER = ['Creature','Planeswalker','Instant','Sorcery','Enchantment','Artifact','Land'];
  const getTypeIdx = c => {
    const tl = c.type_line || '';
    for (let i = 0; i < TYPE_ORDER.length; i++) if (tl.includes(TYPE_ORDER[i])) return i;
    return TYPE_ORDER.length;
  };
  const sorted = [...groups];
  sorted.sort((a, b) => {
    let cmp = 0;
    switch (sortBy) {
      case 'name': cmp = a.card.name.localeCompare(b.card.name); break;
      case 'color':
        cmp = getColorOrder(a.card) - getColorOrder(b.card);
        if (cmp === 0) cmp = a.card.name.localeCompare(b.card.name);
        break;
      case 'cmc':
        cmp = (a.card.cmc || 0) - (b.card.cmc || 0);
        if (cmp === 0) cmp = a.card.name.localeCompare(b.card.name);
        break;
      case 'type':
        cmp = getTypeIdx(a.card) - getTypeIdx(b.card);
        if (cmp === 0) cmp = (a.card.cmc || 0) - (b.card.cmc || 0);
        if (cmp === 0) cmp = a.card.name.localeCompare(b.card.name);
        break;
    }
    return cmp;
  });
  if (sortOrder === 'desc') sorted.reverse();
  return sorted;
}

function sanitizeFilename(name) {
  return name
    .replace(/\//g, '∕').replace(/\\/g, '⧵').replace(/:/g, '꞉')
    .replace(/\*/g, '✱').replace(/\?/g, '？').replace(/"/g, '＂')
    .replace(/</g, '﹤').replace(/>/g, '﹥').replace(/\|/g, '｜')
    .trim();
}
function defaultFilenameFor(deck) {
  const n = deck.name || 'commander-deck';
  return sanitizeFilename(n) + '.json';
}

function renderTabs() {
  const tabs = $('deckTabs');
  tabs.innerHTML = '';
  // Only render decks marked as open
  const openIndices = STATE.decks.map((d, i) => d.open ? i : -1).filter(i => i >= 0);
  // Tabs get narrow if there are many; threshold is 6 → start hiding count/close.
  const narrow = openIndices.length >= 6;
  openIndices.forEach(idx => {
    const deck = STATE.decks[idx];
    const isActive = idx === STATE.currentDeckIndex;
    const colorId = getThemeForDeck(deck);
    const theme = THEME_GROUPS.flatMap(g => g.items).find(t => t.id === colorId) || { swatch: ['#9b7fd4'] };
    const pipStyle = `linear-gradient(135deg, ${theme.swatch[0]}, ${theme.swatch[theme.swatch.length-1]})`;
    const tab = el('div', {
      class: 'tab' + (isActive ? ' active' : '') + (narrow ? ' narrow' : ''),
      role: 'button',
      title: deck.name,
      onclick: () => {
        if (STATE.currentDeckIndex !== idx) {
          STATE.currentDeckIndex = idx;
          saveDecks();
          renderAll();
        }
      }
    }, [
      el('span', { class: 'pip', style: { background: pipStyle } }),
      el('span', { class: 'label' }, deck.name || `Deck ${idx + 1}`),
      el('span', { class: 'count' }, String(deck.cards.length)),
      el('button', {
        class: 'tab-close', title: 'Close tab', 'aria-label': 'Close tab',
        onclick: (e) => {
          e.stopPropagation();
          // If there's only one open tab, the close button deletes the deck instead
          if (openIndices.length === 1) {
            openDeleteDeckModal(idx);
          } else {
            closeDeckTab(idx);
            renderAll();
          }
        }
      }, [icon('close')])
    ]);
    tabs.appendChild(tab);
  });
  // Show the "open elsewhere" dot on the library button if any decks are closed
  const libBtn = $('deckLibraryBtn');
  if (libBtn) {
    const hasClosed = STATE.decks.some(d => !d.open);
    libBtn.classList.toggle('has-hidden', hasClosed);
  }
}

  const cmdIdentity = new Set();
  deck.commanders.forEach(c => (c.color_identity || []).forEach(x => cmdIdentity.add(x)));
  const isViolation = !isCommander && !isToken && deck.commanders.length > 0 && card.color_identity &&
    card.color_identity.some(c => !cmdIdentity.has(c));

  // Determine commander menu option label
  let commanderLabel = '';
  let commanderIcon = '';

  if (isCommander) {
    commanderLabel = 'Remove Commander'; commanderIcon = 'person_remove';

    showCommanderOption = false;
  } else if (deck.commanders.length === 0) {
    commanderLabel = 'Set Commander'; commanderIcon = 'person_add';

      art.appendChild(el('img', { src: card.image_url, alt: card.name, loading: 'lazy' }));
    }

    if ((card.cmc || 0) > 0) art.appendChild(el('span', { class: 'corner-cost' }, String(card.cmc)));

    }, [icon('image_search')]);
    actions.appendChild(altBtn);
    if (showCommanderOption) {

        class: 'icon-btn', title: commanderLabel,
        onclick: (e) => { e.stopPropagation(); handleCommanderAction(card, isCommander, isToken, ids); }
      }, [icon(commanderIcon)]);
      actions.appendChild(cmdBtn);

      }, [icon('content_copy')]);
      actions.appendChild(dupBtn);
    }
    const rmBtn = el('button', {
      class: 'icon-btn danger', title: 'Remove card',
      onclick: (e) => {
        e.stopPropagation();
        if (ids && ids.length > 0) removeCard(ids[0], isCommander, isToken);
        else removeCard(card.id, isCommander, isToken);
      }
    }, [icon('close')]);
    actions.appendChild(rmBtn);

    art.appendChild(actions);
    tile.appendChild(art);
  }

  // Meta
  if (compact) {
    const meta = el('div', { class: 'meta', style: { display: 'contents' } });
    tile.appendChild(isViolation
      ? el('span', { class: 'corner-flag', title: 'Color identity violation' }, [icon('priority_high')])
      : el('span', { style: { width: '14px' } })
    );
    tile.appendChild(el('span', { class: 'name', style: { fontFamily: "'Spectral', serif", fontSize: '14px', fontWeight: 500 } }, card.name + (count > 1 ? ` ×${count}` : '')));
    tile.appendChild(el('span', { class: 'type', style: { fontFamily: "'IBM Plex Mono', monospace", fontSize: '9.5px', letterSpacing: '0.12em', textTransform: 'uppercase', color: 'var(--ink-3)', width: '180px', flexShrink: 0 } }, card.type_line || ''));
    const cols = (card.colors && card.colors.length) ? card.colors : ['C'];
    tile.appendChild(el('span', { class: 'colors' }, cols.map(c => el('span', { class: `col-dot ${c}` }))));
    tile.appendChild(el('span', { class: 'corner-cost' }, String(card.cmc || 0)));
    // Compact actions
    const compactActions = el('div', { class: 'actions-overlay' });
    compactActions.appendChild(el('button', {
      class: 'icon-btn', title: 'Change artwork',
      onclick: (e) => { e.stopPropagation(); openAltArtModal(card, isCommander, isToken, count, indices); }
    }, [icon('image_search')]));
    compactActions.appendChild(el('button', {
      class: 'icon-btn danger', title: 'Remove card',
      onclick: (e) => {
        e.stopPropagation();
        if (ids && ids.length > 0) removeCard(ids[0], isCommander, isToken);
        else removeCard(card.id, isCommander, isToken);
      }
    }, [icon('close')]));
    tile.appendChild(compactActions);
  } else {
    const meta = el('div', { class: 'meta' }, [
      el('span', { class: 'name' }, card.name),
      el('span', { class: 'type' }, card.type_line || '')
    ]);
    tile.appendChild(meta);
  }

  return tile;
}

// ─────────────────────────────────────────────────────────────────────────
// Render: Main deck + tokens grid
// ─────────────────────────────────────────────────────────────────────────
function renderDeck() {
  const deck = getCurrentDeck();
  const list = $('deckList');
  list.innerHTML = '';
  list.className = 'cardgrid ' + STATE.density;

  // Apply filter, search, then group
  deck.cards.forEach((card, i) => { card._deckIndex = i; });
  const q = STATE.deckSearch.toLowerCase();
  let filtered = STATE.filter === 'all' ? deck.cards : deck.cards.filter(c => (c.type_line || '').includes(STATE.filter));
  if (q) filtered = filtered.filter(c => c.name.toLowerCase().includes(q));

  if (filtered.length === 0) {
    list.appendChild(el('div', { class: 'empty', style: { gridColumn: '1 / -1' } },
      deck.cards.length === 0 ? 'Start building your deck.' : 'No cards match the filter.'));
  } else {
    const grouped = groupCardsByName(filtered);
    const sorted = sortCards(grouped, STATE.sortBy, STATE.sortOrder);
    sorted.forEach(g => list.appendChild(createCardTile(g.card, false, false, g.count, g.ids, g.indices)));
  }

  // Counts
  const expectedMain = (deck.commanders.length === 2) ? 98 : 99;
  $('deckCount').textContent = `${deck.cards.length}/${expectedMain}`;

  // Tokens
  const tokenSection = $('tokenSection');
  const tokenList = $('tokenList');
  tokenList.innerHTML = '';
  tokenList.className = 'cardgrid ' + STATE.density;
  if (deck.tokens.length > 0) {
    tokenSection.style.display = '';
    deck.tokens.forEach((t, i) => { t._deckIndex = i; });
    const groupedT = groupCardsByName(deck.tokens);
    const sortedT = sortCards(groupedT, STATE.sortBy, STATE.sortOrder);
    sortedT.forEach(g => tokenList.appendChild(createCardTile(g.card, false, true, g.count, g.ids, g.indices)));
    $('tokenCount').textContent = String(deck.tokens.length);
  } else {
    tokenSection.style.display = 'none';
  }
}

// ─────────────────────────────────────────────────────────────────────────
// Render: Rail / stats
// ─────────────────────────────────────────────────────────────────────────
function renderRail() {
  const deck = getCurrentDeck();
  const rail = $('rail');
  rail.innerHTML = '';

  const cards = deck.cards || [];
  const commanders = deck.commanders || [];
  const total = cards.length + commanders.length;

  // Commander identity
  const cmdColors = new Set();
  commanders.forEach(c => (c.color_identity || []).forEach(x => cmdColors.add(x)));

  // Avg CMC (non-lands)
  const nonLands = cards.filter(c => !c.type_line || !c.type_line.includes('Land'));
  const avgCmc = nonLands.length ? (nonLands.reduce((a, c) => a + (c.cmc || 0), 0) / nonLands.length).toFixed(2) : '—';

  // ── Snapshot ──
  rail.appendChild(el('div', { class: 'rail-section' }, [
    el('h3', {}, 'Snapshot'),
    el('div', { class: 'snapshot-grid' }, [
      el('div', {}, [el('div', { class: 'big-num' }, String(total)), el('div', { class: 'eyebrow' }, 'Cards')]),
      el('div', {}, [el('div', { class: 'big-num' }, avgCmc), el('div', { class: 'eyebrow' }, 'Avg CMC')]),
      el('div', {}, [el('div', { class: 'big-num' }, String(cmdColors.size)), el('div', { class: 'eyebrow' }, 'Colors')]),
    ])
  ]));

  // ── Validation ──
  const issues = validateDeck(deck);
  const valSection = el('div', { class: 'rail-section' }, [el('h3', {}, 'Validation')]);
  const valWrap = el('div', { class: 'validation' });
  if (total === 0) {
    valWrap.appendChild(el('div', { class: 'v-row ok' }, [
      icon('hourglass_empty'),
      el('div', {}, [el('div', { class: 'msg' }, 'Empty deck'), el('div', { class: 'det' }, 'Import or build to validate.')])
    ]));
  } else if (issues.length === 0) {
    valWrap.appendChild(el('div', { class: 'v-row ok' }, [
      icon('check_circle'),
      el('div', {}, [el('div', { class: 'msg' }, 'Deck is valid')])
    ]));
  } else {
    issues.forEach(iss => {
      const type = iss.type === 'error' ? 'bad' : iss.type === 'warning' ? 'warn' : 'ok';
      const children = [icon(iss.icon),
        el('div', {}, [
          el('div', { class: 'msg' }, iss.message),
          iss.detail ? el('div', { class: 'det' }, iss.detail) : null
        ].filter(Boolean))
      ];
      valWrap.appendChild(el('div', { class: `v-row ${type}` }, children));
    });
  }
  valSection.appendChild(valWrap);
  rail.appendChild(valSection);

  // ── Mana curve ──
  if (nonLands.length > 0) {
    const curve = [0,0,0,0,0,0,0,0];
    nonLands.forEach(c => { const i = Math.min(7, Math.floor(c.cmc || 0)); curve[i]++; });
    const max = Math.max(...curve, 1);
    const curveBars = el('div', { class: 'curve' });
    curve.forEach(n => {
      const bar = el('div', { class: 'bar', style: { height: ((n/max)*100) + '%' } });
      if (n > 0) bar.dataset.n = String(n);
      curveBars.appendChild(bar);
    });
    rail.appendChild(el('div', { class: 'rail-section' }, [
      el('h3', {}, 'Mana Curve'),
      curveBars,
      el('div', { class: 'curve-labels' }, ['0','1','2','3','4','5','6','7+'].map(l => el('span', {}, l)))
    ]));
  }

  // ── Type breakdown ──
  const typeDefs = [
    { key: 'Creature', label: 'Creatures' },
    { key: 'Planeswalker', label: 'Planeswalkers' },
    { key: 'Instant', label: 'Instants' },
    { key: 'Sorcery', label: 'Sorceries' },
    { key: 'Enchantment', label: 'Enchantments' },
    { key: 'Artifact', label: 'Artifacts' },
    { key: 'Land', label: 'Lands' },
  ];
  const types = typeDefs.map(td => ({ ...td, count: cards.filter(c => (c.type_line || '').includes(td.key)).length })).filter(t => t.count > 0);
  if (types.length > 0) {
    const maxT = Math.max(...types.map(t => t.count), 1);
    const typesList = el('div', { class: 'types' });
    types.forEach(t => {
      const pct = (t.count / maxT) * 100;
      typesList.appendChild(el('div', { class: 't-row' }, [
        el('span', {}, t.label),
        el('div', { class: 't-bar-bg' }, [el('div', { style: { width: pct + '%' } })]),
        el('span', { class: 'n' }, String(t.count))
      ]));
    });
    const typesSection = el('div', { class: 'rail-section' }, [el('h3', {}, 'Type Breakdown'), typesList]);

    // Land row indicator
    const landCount = cards.filter(c => (c.type_line || '').includes('Land')).length;
    if (landCount > 0) {
      let landKind = 'ok', landLbl = 'OK';
      if (landCount < 33) { landKind = 'low'; landLbl = 'Low'; }
      else if (landCount > 40) { landKind = 'high'; landLbl = 'High'; }
      typesSection.appendChild(
        el('div', { class: 'land-row' }, [
          el('span', { style: { color: 'var(--ink-2)' } }, 'Land count'),
          el('span', {}, [
            el('span', { class: 'mono', style: { fontSize: '13px', color: 'var(--ink)' } }, String(landCount)),
            el('span', { class: 'ind ' + landKind }, landLbl)
          ])
        ])
      );
    }
    rail.appendChild(typesSection);
  }

  // ── Color distribution ──
  const colorOrder = ['W','U','B','R','G'];
  const colorCounts = { W:0,U:0,B:0,R:0,G:0,C:0 };
  let multi = 0;
  cards.forEach(c => {
    const cs = c.colors || [];
    if (cs.length === 0) colorCounts.C++;
    else {
      if (cs.length > 1) multi++;
      cs.forEach(x => { if (colorCounts[x] !== undefined) colorCounts[x]++; });
    }
  });
  const colorTotal = Object.values(colorCounts).reduce((a,b)=>a+b, 0) || 1;
  const activeColors = colorOrder.filter(c => colorCounts[c] > 0);
  if (activeColors.length > 0 || colorCounts.C > 0) {
    const cdList = el('div', { class: 'cd' });
    activeColors.forEach(c => {
      const pct = Math.round((colorCounts[c] / colorTotal) * 100);
      cdList.appendChild(el('div', { class: 'cd-row' }, [
        el('span', { class: `col-dot ${c}`, style: { width: '14px', height: '14px' } }),
        el('div', { class: 'cd-bar' }, [el('div', { class: c, style: { width: pct + '%' } })]),
        el('span', { class: 'cd-pct' }, pct + '%')
      ]));
    });
    if (colorCounts.C > 0) {
      const pct = Math.round((colorCounts.C / colorTotal) * 100);
      cdList.appendChild(el('div', { class: 'cd-row' }, [
        el('span', { class: 'col-dot C', style: { width: '14px', height: '14px' } }),
        el('div', { class: 'cd-bar' }, [el('div', { class: 'C', style: { width: pct + '%' } })]),
        el('span', { class: 'cd-pct' }, pct + '%')
      ]));
    }
    rail.appendChild(el('div', { class: 'rail-section' }, [el('h3', {}, 'Color Pips'), cdList]));
  }
}

// ─────────────────────────────────────────────────────────────────────────
// Deck operations
// ─────────────────────────────────────────────────────────────────────────
function removeCard(cardId, isCommander, isToken) {
  const deck = getCurrentDeck();
  if (isCommander) {
    deck.commanders = deck.commanders.filter(c => c.id !== cardId);
  } else if (isToken) {
    const i = deck.tokens.findIndex(c => c.id === cardId);
    if (i !== -1) deck.tokens.splice(i, 1);
  } else {
    const i = deck.cards.findIndex(c => c.id === cardId);
    if (i !== -1) deck.cards.splice(i, 1);
  }
  saveDecks();
  renderAll();
}

function duplicateCard(card, isToken) {
  const deck = getCurrentDeck();
  const copy = { ...card };
  delete copy._deckIndex;
  if (isToken) deck.tokens.push(copy);
  else deck.cards.push(copy);
  saveDecks();
  renderAll();
  showNotification(`Duplicated ${card.name}`, 'success');
}

function handleCommanderAction(card, isCommander, isToken, ids) {
  const deck = getCurrentDeck();
  const apply = () => {
    saveDecks();
    renderAll();
  };
  if (isCommander) {
    showConfirmDialog({
      title: 'Remove Commander',
      message: `Remove "<b style="color:var(--accent)">${escapeHtml(card.name)}</b>" as commander? The card will be moved back to the Main Deck.`,
      confirmLabel: 'Remove',
      onConfirm: () => {
        deck.commanders = deck.commanders.filter(c => c.id !== card.id);
        deck.cards.push({ ...card });
        apply();
        showNotification(`${card.name} removed as commander`, 'success');
      }
    });
  } else if (deck.commanders.length === 1 && hasPartner(deck.commanders[0]) && hasPartner(card) && partnersCompatible(card, deck.commanders[0])) {
    // Partner — no confirm
    const arr = isToken ? deck.tokens : deck.cards;
    const idx = arr.findIndex(c => c.id === card.id);
    if (idx !== -1) arr.splice(idx, 1);
    deck.commanders.push({ ...card });
    apply();
    showNotification(`${card.name} added as partner commander`, 'success');
  } else if (deck.commanders.length > 0) {
    // Replace
    const names = deck.commanders.map(c => `"<b style="color:var(--accent)">${escapeHtml(c.name)}</b>"`).join(' and ');
    showConfirmDialog({
      title: 'Replace Commander',
      message: `Replace ${names} with "<b style="color:var(--accent)">${escapeHtml(card.name)}</b>"? The old commander(s) will be moved back to the Main Deck.`,
      confirmLabel: 'Replace',
      onConfirm: () => {
        deck.commanders.forEach(c => deck.cards.push({ ...c }));
        deck.commanders = [];
        const arr = isToken ? deck.tokens : deck.cards;
        const idx = arr.findIndex(c => c.id === card.id);
        if (idx !== -1) arr.splice(idx, 1);
        deck.commanders.push({ ...card });
        apply();
        showNotification(`${card.name} set as commander`, 'success');
      }
    });
  } else {
    // Set
    const arr = isToken ? deck.tokens : deck.cards;
    const idx = arr.findIndex(c => c.id === card.id);
    if (idx !== -1) arr.splice(idx, 1);
    deck.commanders.push({ ...card });
    apply();
    showNotification(`${card.name} set as commander`, 'success');
  }
}
